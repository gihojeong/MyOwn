<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HBM 이해도 평가</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<script>try{var t=localStorage.getItem("hbmq-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
/* ═══ HBM 이해도 평가 — 디자인 체계 (DA) ═══
   레이아웃: 출제 범위 사이드바 | 지문 · 지표 · 상황도 | 보기 · 해설 패널
   토큰: 색은 모두 :root 변수로, 라이트/다크 쌍을 함께 정의한다. 상황도 '종이(sheet)'는 다크 모드에서도 밝은 도면으로 유지한다. */
:root {
  /* 바탕 · 면 · 선 */
  --bg: #f3ece2; --surface: #fbf7f1; --surface-2: #f2eadf; --surface-3: #ebe1d3;
  --line: #e0d5c6; --line-strong: #c4b7a5; --edge: #3a3530;
  /* 글자 */
  --ink: #1d1b18; --ink-2: #3b362f; --muted: #675f55; --faint: #8b8276;
  /* 의미 색 (글자색 / 바탕색) */
  --accent: #2f5a1e; --accent-bg: #d3e6b8; --accent-line: #6f9a4f;
  --sel: #4a3d8c; --sel-bg: #e8e1f7; --sel-line: #7d6cc4;
  --ok: #24601c; --ok-bg: #dcefcd; --ok-line: #4f8f3c;
  --bad: #a8361c; --bad-bg: #f9ddd6; --bad-line: #c8552a;
  --warn: #8a4b12; --warn-bg: #fbe3c6;
  --info: #1f4f86; --info-bg: #e2ecfa;
  --focus: #c8552a;
  /* 난이도 */
  --lvB: #2c6a33; --lvB-bg: #dcefdb; --lvI: #1f4f86; --lvI-bg: #dbe8f8; --lvA: #9a2f22; --lvA-bg: #f7d9d4;
  /* 상황도 종이 */
  --sheet: #f9f2e8; --sheet-grid: #ece3d6; --sheet-ink: #1d1b18;
  /* 구(舊) 이름 — 스크립트 인라인 스타일 호환 */
  --paper: var(--bg); --card: var(--surface); --card2: var(--surface-2); --ink2: var(--ink-2);
  --green: var(--accent-bg); --green-ink: var(--accent); --violet: var(--sel-bg); --violet-line: #d5c8e2;
  --orange: var(--warn-bg); --pink: var(--bad-bg); --mint: #dff0de; --blue: var(--info-bg); --rust: #c8552a; --yellow: #f7dc8c;
  /* 글꼴 · 크기 */
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Noto Sans KR", monospace;
  --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14.5px; --fs-lg: 16px; --fs-xl: 19px; --fs-2xl: 23px;
  --r-sm: 8px; --r-md: 11px; --r-lg: 14px;
  --shadow: 0 1px 0 rgba(58,53,48,.06), 0 2px 8px rgba(58,53,48,.06);
  --lift: 0 2px 0 var(--edge);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161411; --surface: #201d19; --surface-2: #29251f; --surface-3: #332e27;
  --line: #3a342c; --line-strong: #544b40; --edge: #d9cfc1;
  --ink: #f2ebe1; --ink-2: #dcd2c5; --muted: #a99f92; --faint: #857c70;
  --accent: #bfe2a0; --accent-bg: #2f4527; --accent-line: #7fae5f;
  --sel: #d3c7ff; --sel-bg: #322a4c; --sel-line: #9585dc;
  --ok: #b6e6a0; --ok-bg: #233f1d; --ok-line: #6fb158;
  --bad: #ffab95; --bad-bg: #4a241c; --bad-line: #e2754f;
  --warn: #ffcf9a; --warn-bg: #4b331b; --info: #b8d3ff; --info-bg: #213149;
  --focus: #ff9a6c;
  --lvB: #b8e3b5; --lvB-bg: #233d25; --lvI: #b8d3ff; --lvI-bg: #20314a; --lvA: #ffb2a5; --lvA-bg: #4a2520;
  --mint: #2a4530; --violet-line: #4e4260; --rust: #ef8a5c; --yellow: #6a5a28;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.25); --lift: 0 2px 0 #000;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #161411; --surface: #201d19; --surface-2: #29251f; --surface-3: #332e27;
  --line: #3a342c; --line-strong: #544b40; --edge: #d9cfc1;
  --ink: #f2ebe1; --ink-2: #dcd2c5; --muted: #a99f92; --faint: #857c70;
  --accent: #bfe2a0; --accent-bg: #2f4527; --accent-line: #7fae5f;
  --sel: #d3c7ff; --sel-bg: #322a4c; --sel-line: #9585dc;
  --ok: #b6e6a0; --ok-bg: #233f1d; --ok-line: #6fb158;
  --bad: #ffab95; --bad-bg: #4a241c; --bad-line: #e2754f;
  --warn: #ffcf9a; --warn-bg: #4b331b; --info: #b8d3ff; --info-bg: #213149;
  --focus: #ff9a6c;
  --lvB: #b8e3b5; --lvB-bg: #233d25; --lvI: #b8d3ff; --lvI-bg: #20314a; --lvA: #ffb2a5; --lvA-bg: #4a2520;
  --mint: #2a4530; --violet-line: #4e4260; --rust: #ef8a5c; --yellow: #6a5a28;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.25); --lift: 0 2px 0 #000;
  color-scheme: dark; }

/* ── 기본 ── */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--sans); font-size: var(--fs-md); line-height: 1.6; word-break: keep-all; overflow-wrap: break-word;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
kbd { border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; font-family: var(--mono); font-size: 11px; background: var(--surface); color: var(--ink-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── 머리띠 ── */
.top { display: flex; align-items: center; gap: 8px 10px; padding: 10px 0 8px; flex-wrap: wrap; position: relative; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; letter-spacing: -0.01em; margin-right: 4px; }
.top .sp { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-xs); font-weight: 700; line-height: 1.2; border: 1px solid var(--line-strong);
  border-radius: 99px; padding: 4px 10px; background: var(--surface); color: var(--ink); white-space: nowrap; }
.chip.num, #clock, #topProg { font-family: var(--mono); font-variant-numeric: tabular-nums; }
#clock { min-width: 112px; justify-content: center; }
.iconbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-sm);
  padding: 6px 11px; font-size: var(--fs-sm); font-weight: 600; line-height: 1.25; min-height: 34px; }
.iconbtn:hover { background: var(--surface-2); border-color: var(--edge); }
.iconbtn .ic { font-size: 14px; line-height: 1; }
.progbar { height: 4px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.progbar i { display: block; height: 100%; width: 0; background: var(--accent-line); border-radius: 99px; transition: width .3s ease; }

/* ── 3단 격자 ── */
.app { display: grid; grid-template-columns: 280px minmax(0, 5fr) minmax(340px, 3fr); gap: 12px; margin-top: 10px; align-items: start; }
.app > .wide { grid-column: 2 / -1; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.crumb { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; }
.hd { display: flex; gap: 8px 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
h1 { font-size: clamp(17px, 1.45vw, 21px); margin: 2px 0 2px; line-height: 1.35; letter-spacing: -0.015em; text-wrap: balance; overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: var(--fs-sm); margin: 0 0 12px; }
.chips { display: flex; gap: 6px; padding-top: 3px; flex-wrap: wrap; }
.qhdr { font-size: var(--fs-xs); color: var(--muted); font-weight: 700; letter-spacing: .01em; margin: 12px 0 7px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ── 사이드바 ── */
.side { padding: 14px 10px 12px; }
.side h3 { font-size: var(--fs-xs); margin: 0 6px 10px; display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-weight: 700; }
.les { margin-bottom: 2px; }
.les > button { width: 100%; display: flex; align-items: center; gap: 9px; border: 0; background: none; padding: 8px 8px; border-radius: var(--r-sm); text-align: left; font-weight: 700; font-size: var(--fs-md); line-height: 1.35; }
.les > button:hover { background: var(--surface-2); }
.les .sq { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--edge); flex: none; }
.les .cnt { margin-left: auto; color: var(--muted); font-size: var(--fs-xs); font-weight: 600; font-family: var(--mono); }
.les .cnt.done { color: var(--ok); font-weight: 800; }
.steps { list-style: none; margin: 2px 0 8px 15px; padding: 0 0 0 9px; border-left: 1px dashed var(--line-strong); }
.steps button { width: 100%; text-align: left; border: 1px solid transparent; background: none; padding: 5px 8px; border-radius: 7px; font-size: var(--fs-sm); line-height: 1.45; color: var(--ink-2); display: flex; gap: 7px; }
.steps button:hover:not(:disabled) { background: var(--surface-2); }
.steps button[aria-current="step"] { background: var(--accent-bg); border-color: var(--accent-line); color: var(--accent); font-weight: 700; }
.steps .ck { color: var(--faint); width: 13px; flex: none; text-align: center; }
.steps .ck.a { color: var(--rust); font-weight: 800; }
.steps .ck.g-ok { color: var(--ok); } .steps .ck.g-no { color: var(--bad); }
.prog { margin-top: 10px; padding: 9px 8px 0; border-top: 1px solid var(--line); font-size: var(--fs-xs); color: var(--muted); display: flex; justify-content: space-between; font-family: var(--mono); }
.refbtn { width: 100%; margin-top: 8px; border: 1px solid var(--line-strong); background: var(--surface-2); border-radius: var(--r-sm); padding: 8px; font-size: var(--fs-sm); font-weight: 600; }
.refbtn:hover { border-color: var(--edge); }

/* ── 난이도 칩 (색 + 막대 수: 색만으로 구분하지 않는다) ── */
.lvchip { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 800; line-height: 1.2; border-radius: 99px; padding: 4px 10px 4px 8px; border: 1px solid currentColor; white-space: nowrap; }
.lvchip .bars3 { display: inline-flex; gap: 2px; align-items: flex-end; }
.lvchip .bars3 i { width: 3px; border-radius: 1px; background: currentColor; opacity: .28; }
.lvchip .bars3 i:nth-child(1) { height: 6px; } .lvchip .bars3 i:nth-child(2) { height: 9px; } .lvchip .bars3 i:nth-child(3) { height: 12px; }
.lv-B { color: var(--lvB); background: var(--lvB-bg); } .lv-B .bars3 i:nth-child(-n+1) { opacity: 1; }
.lv-I { color: var(--lvI); background: var(--lvI-bg); } .lv-I .bars3 i:nth-child(-n+2) { opacity: 1; }
.lv-A { color: var(--lvA); background: var(--lvA-bg); } .lv-A .bars3 i { opacity: 1; }

/* ── 지문 · 지표 ── */
.stemcard { padding: 14px 16px 14px; }
.stem { font-size: var(--fs-md); line-height: 1.75; color: var(--ink-2); margin: 0; }
.stemcard .qhdr { margin: 12px 0 7px; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px; }
.metric { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px 10px 7px; min-width: 0; }
.metric .l { font-size: 11.5px; color: var(--muted); font-weight: 700; line-height: 1.3; display: flex; gap: 5px; }
.metric .l .ic { opacity: .7; flex: none; }
.metric .v { font-weight: 800; font-size: var(--fs-lg); line-height: 1.3; margin-top: 2px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

/* ── 상황도 ── */
.canvas { padding: 10px 12px 12px; }
.fighd { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.fighd .qhdr { margin: 0; }
.tools { display: flex; gap: 6px; }
.figflag { display: inline-block; background: var(--yellow); border: 1px solid var(--edge); border-radius: 99px; padding: 1px 9px; font-size: 11.5px; font-weight: 700; color: var(--ink); }
:root[data-theme="dark"] .figflag { color: var(--ink); }
.stage-wrap { border-radius: var(--r-md); }
.stage { display: block; width: 100%; height: auto; background-color: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-md);
  background-image: repeating-linear-gradient(30deg, transparent 0 33px, var(--sheet-grid) 33px 34px), repeating-linear-gradient(150deg, transparent 0 33px, var(--sheet-grid) 33px 34px); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stage { filter: brightness(.9) contrast(1.02); border-color: #000; } }
:root[data-theme="dark"] .stage { filter: brightness(.9) contrast(1.02); border-color: #000; }
.stage .ft { width: 100%; height: 100%; display: flex; flex-direction: column; font-family: var(--sans); overflow: visible; color: var(--sheet-ink); word-break: keep-all; overflow-wrap: anywhere; }
.stage .ft.nw { white-space: nowrap; align-items: center; }
.stage .el { animation: rise .42s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 4ms); }
.stage .el.flow { animation: rise .42s both, dash 1.1s linear infinite; animation-delay: calc(var(--i) * 4ms), 0s; }
.paused .stage .el.flow { animation-play-state: running, paused; }
@keyframes rise { from { opacity: .15; transform: translateY(3px); } to { opacity: 1; transform: none; } }
@keyframes dash { to { stroke-dashoffset: -22; } }
@media (prefers-reduced-motion: reduce) { .stage .el, .stage .el.flow { animation: none !important; } }
.mtable { width: 100%; height: 100%; border-collapse: collapse; font-family: var(--sans); font-size: 17px; line-height: 1.32; color: #34302b; table-layout: fixed; }
.mtable th, .mtable td { border: 1px solid #c6bbac; padding: 7px 9px; vertical-align: middle; background: #fffdf8; }
.mtable th { font-size: 17px; color: #1d1b18; background: #f6efe4; padding-left: 5px; padding-right: 5px; } .mtable td.w { color: #b8321f; background: #fbedea; font-weight: 700; }

/* ── 보기 · 해설 패널 ── */
.panel { padding: 16px 18px 14px; }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: var(--fs-xs); color: var(--muted); font-weight: 700; }
.ph .num { font-size: var(--fs-sm); color: var(--ink-2); }
.ask { font-size: var(--fs-lg); font-weight: 700; line-height: 1.55; margin: 10px 0 2px; color: var(--ink); text-wrap: pretty; }
.opts { display: grid; gap: 8px; margin: 2px 0; }
.opt { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: start; text-align: left; width: 100%;
  border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-md); padding: 11px 12px 11px 11px;
  font-size: var(--fs-md); line-height: 1.6; transition: background .12s, box-shadow .12s, border-color .12s; }
.opt:hover:not(:disabled) { background: var(--surface-2); border-color: var(--edge); }
.opt .n { font-family: var(--mono); font-weight: 800; font-size: 13px; border: 1.5px solid var(--edge); border-radius: 50%;
  width: 26px; height: 26px; display: grid; place-items: center; background: var(--surface); margin-top: -1px; }
.opt .tx { min-width: 0; overflow-wrap: anywhere; }
.opt .tag { font-size: 11px; font-weight: 800; border-radius: 99px; padding: 2px 8px; align-self: center; white-space: nowrap; }
.opt.sel { background: var(--sel-bg); border-color: var(--sel-line); box-shadow: inset 0 0 0 1.5px var(--sel-line); }
.opt.sel .n { background: var(--sel); color: var(--surface); border-color: var(--sel); }
.opt.ok { background: var(--ok-bg); border-color: var(--ok-line); box-shadow: inset 0 0 0 1.5px var(--ok-line); }
.opt.ok .n { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.opt.ok .tag { background: var(--ok); color: var(--surface); }
.opt.no { background: var(--bad-bg); border-color: var(--bad-line); box-shadow: inset 0 0 0 1.5px var(--bad-line); }
.opt.no .n { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.opt.no .tag { background: var(--bad); color: var(--surface); }
.opt.dim { opacity: .72; }
.verdict { font-size: var(--fs-sm); font-weight: 800; border-radius: 99px; padding: 3px 12px; border: 1px solid currentColor; }
.v-ok { background: var(--ok-bg); color: var(--ok); } .v-no { background: var(--bad-bg); color: var(--bad); }

.exp { background: var(--surface-2); border: 1px solid var(--line); border-left: 4px solid var(--sel-line); border-radius: var(--r-md); padding: 12px 14px 12px; margin-top: 14px; }
.exp .k { font-size: var(--fs-xs); color: var(--sel); font-weight: 800; display: flex; align-items: center; gap: 8px; }
.exp .k .ans { color: var(--ink-2); font-weight: 700; }
.exp p { margin: 7px 0 0; font-size: var(--fs-md); line-height: 1.78; color: var(--ink-2); }
.exp p.calc { background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--r-sm); padding: 7px 10px; }
.exp .mx { font-family: var(--mono); font-size: .92em; font-variant-numeric: tabular-nums; color: var(--ink); background: var(--surface-3); border-radius: 4px; padding: 1px 4px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.exp p.calc .mx { background: none; padding: 0; }
.exp sup { font-size: .72em; line-height: 0; }
.exp .cn { font-weight: 800; color: var(--sel); }
.exp .src { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: var(--fs-xs); line-height: 1.6; color: var(--muted); }
.exp .src b { color: var(--ink-2); }

.gradebar { display: flex; gap: 8px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.gradebar .big { flex: 1; border: 1px solid var(--edge); border-radius: var(--r-md); padding: 11px; font-weight: 800; font-size: var(--fs-md); background: var(--warn-bg); color: var(--ink); box-shadow: var(--lift); text-align: center; }
.gradebar .big:disabled { opacity: .55; box-shadow: none; background: var(--surface-2); border-color: var(--line-strong); color: var(--muted); }
.nav { display: grid; grid-template-columns: auto 1fr; gap: 8px; margin-top: 10px; }
.nav button { border: 1px solid var(--edge); border-radius: var(--r-md); padding: 11px 14px; font-weight: 700; font-size: var(--fs-md); background: var(--surface-2); }
.nav .nx { background: var(--accent-bg); color: var(--accent); box-shadow: var(--lift); text-align: center; }
.nav button:disabled { opacity: .5; box-shadow: none; }
.hint2 { font-size: var(--fs-xs); color: var(--muted); margin-top: 10px; line-height: 1.7; }

/* ── 시작 화면 ── */
.startwrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; max-width: 1020px; margin: 0 auto 24px; width: 100%; grid-column: 1 / -1; }
.setup { padding: 24px 26px; }
.setup h1 { font-size: clamp(19px, 2vw, 24px); margin: 4px 0 8px; }
.setup .lead { color: var(--ink-2); font-size: var(--fs-md); margin: 0 0 18px; line-height: 1.8; }
.fld { margin: 0 0 22px; }
.fld > label { display: block; font-size: var(--fs-sm); font-weight: 800; color: var(--ink); margin: 0 0 8px; }
.fld .note, .note { font-size: var(--fs-sm); color: var(--muted); margin: 8px 0 0; line-height: 1.7; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-sm); overflow: hidden; flex-wrap: wrap; max-width: 100%; background: var(--surface); }
.seg button { border: 0; border-right: 1px solid var(--line); background: transparent; padding: 8px 14px; font-size: var(--fs-sm); font-weight: 600; min-height: 38px; }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--surface-2); }
.seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); font-weight: 800; box-shadow: inset 0 -2px 0 var(--accent-line); }
.domgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.domgrid button { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left;
  border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-md); padding: 10px 12px; font-size: var(--fs-md); min-height: 46px; }
.domgrid button:hover { border-color: var(--edge); }
.domgrid button[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent-line); box-shadow: inset 0 0 0 1px var(--accent-line); color: var(--ink); }
.domgrid .bx { width: 20px; height: 20px; border: 1.5px solid var(--edge); border-radius: 5px; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #1d1b18; }
.domgrid button[aria-pressed="false"] .bx { background: var(--surface) !important; }
.domgrid .c { font-family: var(--mono); font-size: var(--fs-xs); color: var(--muted); }
.startbar { display: flex; gap: 10px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.startbtn { flex: 1 1 260px; border: 1px solid var(--edge); border-radius: var(--r-lg); padding: 15px; font-weight: 800; font-size: var(--fs-lg);
  background: var(--accent-bg); color: var(--accent); box-shadow: var(--lift); text-align: center; }
.startbtn:disabled { opacity: .5; box-shadow: none; background: var(--surface-2); color: var(--muted); }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.summary .b, .score .b { border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 14px; background: var(--surface-2); min-width: 0; }
.summary .b .l, .score .b .l { font-size: var(--fs-xs); color: var(--muted); font-weight: 700; }
.summary .b .v, .score .b .v { font-family: var(--mono); font-size: 20px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; line-height: 1.3; overflow-wrap: anywhere; }
.toolbar { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin: 10px 0 0; }

/* ── 결과 ── */
.res { padding: 20px 22px; }
.score { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.score .b .v small { font-size: 13px; color: var(--muted); font-weight: 600; }
.res h4 { font-size: var(--fs-sm); margin: 22px 0 8px; color: var(--ink); font-weight: 800; }
.res .wrongs { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.res .wrongs li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; font-size: var(--fs-sm); align-items: center;
  border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; background: var(--surface-2); }
.res .wrongs button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 7px; padding: 5px 10px; font-size: var(--fs-xs); font-weight: 700; }
.warnline { color: var(--bad); font-weight: 700; margin: -4px 0 10px; font-size: var(--fs-sm); }
svg.chart { display: block; width: 100%; max-width: 860px; height: auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); }
svg.chart .gl { stroke: var(--line-strong); stroke-width: .8; stroke-dasharray: 4 3; }
svg.chart .ax { stroke: var(--ink-2); stroke-width: 1.4; }
svg.chart .tk { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
svg.chart .tl { fill: var(--ink-2); font-size: 12px; font-weight: 700; font-family: var(--sans); }
svg.chart .ln { stroke: var(--rust); stroke-width: 2.4; fill: none; stroke-linejoin: round; }
svg.chart .pt { fill: var(--rust); }
svg.chart .pv { fill: var(--ink); font-size: 11px; font-weight: 700; font-family: var(--mono); }
.bars { position: relative; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 18px 8px; max-width: 860px; }
.brow { display: grid; grid-template-columns: minmax(84px, 168px) minmax(0, 1fr) 96px; align-items: center; gap: 12px; min-height: 30px; position: relative; z-index: 1; }
.blab { font-size: var(--fs-sm); text-align: right; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btrack { height: 18px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface); overflow: hidden; }
.bfill { height: 100%; border-right: 1px solid var(--edge); }
.bval { font-family: var(--mono); font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); white-space: nowrap; }
.bval span { font-weight: 400; color: var(--muted); }
.baxis { display: grid; grid-template-columns: minmax(84px, 168px) minmax(0, 1fr) 96px; gap: 12px; margin-top: 4px; }
.baxis .sc { position: relative; height: 18px; }
.baxis .sc span { position: absolute; transform: translateX(-50%); font-family: var(--mono); font-size: 11px; color: var(--muted); top: 1px; }
.btitle { text-align: center; font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); margin: 2px 0 4px; }
.histtab { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); margin-top: 4px; }
.histtab th, .histtab td { border: 1px solid var(--line); padding: 7px 10px; text-align: center; background: var(--surface-2); }
.histtab th { background: var(--surface); font-size: var(--fs-xs); color: var(--muted); font-weight: 700; }
.histtab td:nth-child(2) { font-family: var(--mono); font-size: var(--fs-xs); }
.tablewrap { overflow-x: auto; }

/* ── 그림 확대 ── */
.lb { position: fixed; inset: 0; background: rgba(20,17,13,.72); z-index: 50; display: grid; place-items: center; padding: 20px; }
.lb[hidden] { display: none; }
.lb .inner { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-lg); padding: 12px 14px 14px; max-width: 1500px; width: 100%; max-height: 94vh; max-height: 94dvh; overflow: auto; }
.lb .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; position: sticky; left: 0; }
.lb .bar .t { font-size: var(--fs-sm); font-weight: 700; flex: 1; }

/* ══ 화면 배치 ══ */
/* 데스크톱 (> 1180px): 문항 화면은 뷰포트 고정 3단, 각 단이 따로 스크롤 */
@media (min-width: 1181px) {
  html:not(.sc), html:not(.sc) body { height: 100%; overflow: hidden; }
  body:not(.scrollable) { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  body:not(.scrollable) .app { flex: 1 1 auto; min-height: 0; align-items: stretch; padding-bottom: 12px; }
  body:not(.scrollable) .side { height: 100%; overflow: auto; }
  body:not(.scrollable) #main { height: 100%; min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  body:not(.scrollable) .stemcard { flex: 0 0 auto; }
  body:not(.scrollable) .stem { max-height: 30vh; max-height: 30dvh; overflow: auto; padding-right: 4px; }
  body:not(.scrollable) #figRow { flex: 1 1 auto; min-height: 240px; display: flex; flex-direction: column; overflow: hidden; }
  body:not(.scrollable) #figRow .stage-wrap { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
  body:not(.scrollable) #figRow svg.stage { width: 100%; height: 100%; }
  body:not(.scrollable) #panelCol { height: 100%; min-height: 0; overflow: auto; overscroll-behavior: contain; }
  body.scrollable .side { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; }
  body.nav-off .app { grid-template-columns: 0 minmax(0, 5fr) minmax(340px, 3fr); column-gap: 0; }
  body.nav-off .app > #main { margin-right: 12px; }
  body.nav-off .side { display: none; }
}
@media (min-width: 1181px) and (max-width: 1430px) { .app { grid-template-columns: 248px minmax(0, 5fr) minmax(320px, 3fr); } }
@media (min-width: 1700px) { body { font-size: 15px; } .app { grid-template-columns: 300px minmax(0, 5fr) minmax(400px, 3fr); } .stem { font-size: 15.5px; } .opt { font-size: 15.5px; } .exp p { font-size: 15.5px; } }
/* 태블릿 가로 (901–1180px): 지문·그림 | 보기 2단, 목록은 ☰ 로 펼침 */
@media (max-width: 1180px) {
  .app { grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); }
  .app > .wide, .app > #main.wide, .app > #panelCol.wide { grid-column: 1 / -1; }
  .side { display: none; grid-column: 1 / -1; }
  body.nav-open .side { display: block; }
  #main { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #panelCol { position: sticky; top: 8px; max-height: calc(100vh - 16px); max-height: calc(100dvh - 16px); overflow: auto; }
  #panelCol.wide { position: static; max-height: none; }
  #figRow svg.stage { max-height: 70vh; }
}
/* 태블릿 세로 · 폰 (≤ 900px): 1단 */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  #panelCol { position: static; max-height: none; overflow: visible; }
  .domgrid { grid-template-columns: minmax(0, 1fr); }
  .lb { padding: 8px; }
  .lb .inner { max-height: 96dvh; padding: 10px; }
  .lb .stage-wrap { overflow: auto; }
  .lb svg.stage { width: 900px; max-width: none; }
}
@media (max-width: 900px) { .iconbtn .lbl { display: none; } .iconbtn { min-width: 38px; justify-content: center; } }
@media (hover: none) and (pointer: coarse) { .kbdhint, .qhdr kbd { display: none; } }
@media (max-width: 600px) {
  .top { gap: 6px; padding-top: 8px; }
  .brand { font-size: 15px; flex: 1 0 auto; }
  .top .sp { display: none; }
  .iconbtn .lbl { display: none; }
  .iconbtn { padding: 6px 9px; min-width: 38px; min-height: 38px; justify-content: center; }
  #clock { min-width: 0; }
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stemcard, .panel, .canvas { padding-left: 12px; padding-right: 12px; }
  .setup, .res { padding: 18px 14px; }
  .opt { padding: 11px 10px; gap: 9px; }
  .brow, .baxis { grid-template-columns: 76px minmax(0, 1fr) 74px; gap: 8px; }
  .bars { padding: 12px 10px 8px; }
  .fighd .qhdr { font-size: 11.5px; }
  /* 폰에서는 그림 글자가 작아지므로 "크게 보기" 글자를 남기고, 그림을 눌러도 크게 보기가 열린다 */
  #zoom .lbl { display: inline; }
  #figRow .stage-wrap { cursor: zoom-in; }
}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><g stroke="currentColor" stroke-width="1"><path d="M11 13l8-4-8-4-8 4z" fill="#e2d6f3"/><path d="M3 9v3l8 4v-3z" fill="#cbbfdc"/><path d="M19 9v3l-8 4v-3z" fill="#b6a9c9"/><path d="M3 13v3l8 4v-3z" fill="#cfe3b2"/><path d="M19 13v3l-8 4v-3z" fill="#a9c08c"/></g></svg>HBM 이해도 평가</div>
  <span class="chip" style="background:var(--green)" id="modeChip">시험 구성</span>
  <span class="sp"></span>
  <span class="chip" id="clock" role="timer" aria-live="off">—</span>
  <span class="chip" id="topProg">0 / 0</span>
  <button class="iconbtn" id="navBtn" type="button" aria-label="출제 범위 목록 접기/펼치기" aria-expanded="true"><span class="ic" aria-hidden="true">☰</span><span class="lbl">목록</span></button>
  <button class="iconbtn" id="startBtn" type="button" aria-label="시험 구성"><span class="ic" aria-hidden="true">⚙</span><span class="lbl">시험 구성</span></button>
  <button class="iconbtn" id="resBtn" type="button" aria-label="결과"><span class="ic" aria-hidden="true">▤</span><span class="lbl">결과</span></button>
  <button class="iconbtn" id="themeBtn" type="button" aria-label="밝은/어두운 테마 전환"><span class="ic" aria-hidden="true">◐</span><span class="lbl">테마</span></button>
</header>
<div class="progbar" id="progbar" role="progressbar" aria-label="응답 진행" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>

<div class="app" id="app"></div>
<div class="lb" id="lb" hidden><div class="inner"><div class="bar"><span class="t" id="lbT"></span><button class="iconbtn" id="lbX" type="button">✕ 닫기</button></div><div id="lbB"></div></div></div>

<script>
const MODS = {};
var LIB = (function () {
  const U = 100, PT = U / 72;
  const FS = 1.52;   // 상황도 글자 확대 배율 (지문 글자 크기에 맞춤)
  const K = {
    paper: "F4EBE0", sheet: "F9F2E8", card: "F8F0E6", line: "DDD3C5", lineSoft: "E6DDD0", lineStrong: "C6BBAC",
    edge: "3A3530", ink: "1D1B18", ink2: "34302B", muted: "6F6961", muted2: "8B847A",
    green: "CFE3B2", green2: "B2D491", green3: "7FC278", violet: "E7DDF5", violet2: "CDBDE6", orange: "FCDCBD", orange2: "F4B98A",
    mint: "DFF0DE", rust: "D0683A", blue: "CFE0F5", blue2: "A9C6EC", yellow: "F7DC8C", cream: "FFFBF4", red: "C8372D", gray: "D9D2C7",
  };
  const M = { dram: "E2D6F3", base: "CFE3B2", xpu: "BCD3F0", inter: "E8DCC8", sub: "D8CDBD", phy: "F8C99B", mc: "F7DC8C", pe: "F2A88B", sram: "BFE3DA", sens: "F5D0E3", d2d: "F8C99B", cold: "C9D4DE", lp: "D7E4F3" };
  function shade(hex, k) {
    const n = [0, 2, 4].map((i) => parseInt(hex.substr(i, 2), 16));
    return n.map((v) => { const t = k > 0 ? v + (255 - v) * k : v * (1 + k); return Math.max(0, Math.min(255, Math.round(t))).toString(16).padStart(2, "0"); }).join("").toUpperCase();
  }
  const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const f = (v) => (Math.round(v * U * 10) / 10);
  const col = (c) => (c ? "#" + c : "none");
  const nm = (p) => p;
  function emit(s, str, cls) { s.n = (s.n || 0) + 1; s.out.push(str.replace("<", `<`).replace(/^<(\w+)/, `<$1 class="el ${cls || ""}" style="--i:${Math.min(s.n, 160)}"`)); }
  function strokeAttrs(o, defW = 0.9) {
    if (o.line === null) return 'stroke="none"';
    const w = o.lw == null ? defW : o.lw;
    return `stroke="${col(o.line || K.edge)}" stroke-width="${(w * PT * 0.9).toFixed(2)}" stroke-linejoin="round"${o.dash ? ' stroke-dasharray="5 3.5"' : ""}`;
  }
  function poly(s, pts, fill, o = {}) {
    const op = o.tr ? ` fill-opacity="${(1 - o.tr / 100).toFixed(2)}"` : "";
    emit(s, `<polygon points="${pts.map((p) => f(p[0]) + "," + f(p[1])).join(" ")}" fill="${col(fill)}"${op} ${strokeAttrs(o)}/>`);
  }
  function L(s, x1, y1, x2, y2, c = K.edge, w = 1, o = {}) {
    emit(s, `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${col(c)}" stroke-width="${(w * PT * 0.9).toFixed(2)}"${o.dash ? ' stroke-dasharray="5 3.5"' : ""}${o.lead ? ' data-lead="1"' : ""} stroke-linecap="round"/>`, o.flow ? "flow" : "");
  }
  function A(s, x1, y1, x2, y2, c = K.edge, w = 1.25, o = {}) {
    const ang = Math.atan2(y2 - y1, x2 - x1), hl = o.hl || 0.09 + w * 0.012, hw = hl * 0.62;
    const head = (xa, ya, a) => {
      const bx = xa - hl * Math.cos(a), by = ya - hl * Math.sin(a);
      poly(s, [[xa, ya], [bx + hw * Math.sin(a), by - hw * Math.cos(a)], [bx - hw * Math.sin(a), by + hw * Math.cos(a)]], c, { line: null });
      return [bx, by];
    };
    let [sx, sy] = [x1, y1], [ex, ey] = [x2, y2];
    if (o.end !== false) [ex, ey] = head(x2, y2, ang);
    if (o.both) [sx, sy] = head(x1, y1, ang + Math.PI);
    emit(s, `<line x1="${f(sx)}" y1="${f(sy)}" x2="${f(ex)}" y2="${f(ey)}" stroke="${col(c)}" stroke-width="${(w * PT * 0.9).toFixed(2)}" stroke-dasharray="${o.dash ? "5 3.5" : "7 4"}" stroke-linecap="round"/>`, "flow");
  }
  function runsHTML(text, o) {
    if (Array.isArray(text)) return text.map((r) => {
      const ro = r.options || {}; let st = "";
      if (ro.bold) st += "font-weight:700;"; if (ro.color) st += `color:#${ro.color};`; if (ro.fontSize) st += `font-size:${ro.fontSize * PT}px;`;
      return `<span style="${st}">${esc(r.text)}</span>${ro.breakLine ? "<br>" : ""}`;
    }).join("");
    return esc(text).replace(/\n/g, "<br>");
  }
  function fo(s, x, y, w, h, html, o) {
    // 글자 한 줄이 들어갈 최소 높이 보장 (foreignObject 는 자기 상자 밖을 잘라낸다)
    const need = ((o.fs || 10) * PT * FS * (o.lsm || 1.0) * 1.2 + 3) / U;
    if (h < need) { const d = need - h; if (o.valign === "middle") y -= d / 2; else if (o.valign === "bottom") y -= d; h = need; }
    const jc = o.valign === "middle" ? "center" : o.valign === "bottom" ? "flex-end" : "flex-start";
    const st = `font-size:${((o.fs || 10) * PT * FS).toFixed(1)}px;line-height:${(o.lsm || 1.0) * 1.2};color:#${o.color || K.ink};font-weight:${o.bold ? 700 : 400};text-align:${o.align || "left"};justify-content:${jc}`;
    emit(s, `<foreignObject x="${f(x)}" y="${f(y)}" width="${f(Math.max(w, 0.05))}" height="${f(Math.max(h, 0.05))}"><div xmlns="http://www.w3.org/1999/xhtml" class="ft${o.nowrap ? " nw" : ""}" style="${st}">${html}</div></foreignObject>`, "txt");
  }
  function T(s, text, x, y, w, h, o = {}) { fo(s, x, y, w, h, runsHTML(text, o), o); }
  function R(s, x, y, w, h, fill, o = {}) {
    const rx = o.round ? Math.min(w, h) * o.round * 0.5 : 0;
    const op = o.tr ? ` fill-opacity="${(1 - o.tr / 100).toFixed(2)}"` : "";
    if (o.shadow) emit(s, `<rect x="${f(x + 0.015)}" y="${f(y + 0.025)}" width="${f(w)}" height="${f(h)}" rx="${f(rx)}" fill="#46413B"/>`);
    emit(s, `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="${f(rx)}" fill="${col(fill)}"${op} ${strokeAttrs(o)}/>`);
    if (o.text != null && o.text !== "") {
      // 글자 크기 상한: 상자 높이(줄 수)와 한 줄 상자의 폭에 맞춘다 (최소 5.5pt)
      const str = String(o.text), lines = str.split("\n").length, nw = !str.includes("\n") && h < 0.35;
      let fs = o.fs || 8;
      if (!o.pill) {
        fs = Math.min(fs, (h * U - 2) / (lines * PT * FS * 1.2));
        if (nw) { const tw0 = tw(str, fs * FS) * 1.04; if (tw0 > w - 0.08) fs = fs * (w - 0.08) / tw0; }
        fs = Math.max(5.5, fs);
      }
      fo(s, x + 0.02, y, w - 0.04, h, runsHTML(o.text), { fs, bold: o.bold, color: o.color, align: o.align || "center", valign: "middle", nowrap: nw });
    }
  }
  function E(s, x, y, w, h, fill, o = {}) {
    emit(s, `<ellipse cx="${f(x + w / 2)}" cy="${f(y + h / 2)}" rx="${f(w / 2)}" ry="${f(h / 2)}" fill="${col(fill)}" ${o.line === null ? 'stroke="none"' : strokeAttrs(o)}/>`);
  }
  function tw(t, fs) { let e = 0; for (const ch of t) e += /[ㄱ-힝]/.test(ch) ? 0.93 : /[A-Z0-9%#@]/.test(ch) ? 0.66 : 0.56; return e * fs / 72; }
  function pill(s, cx, cy, text, o = {}) {
    const fs = o.fs || 8; let w = tw(text, fs * FS) * 1.08 + 0.26 * FS, h = (o.h || 0.24) * FS;
    // 칸 가드: 위쪽 영역(주석 띠 위)에서는 왼쪽 그림칸과 오른쪽 설명칸 사이 통로를 넘지 않게 줄바꿈한다
    let mw = o.maxW;

  [["A", p.densA || 15, K.blue], ["B", p.densB || 55, K.orange]].forEach(([nm, d, c]) => { const xx = g.X(Math.min(80, d));
    L(s, xx, g.Y(0), xx, g.Y(200), K.edge, 0.8, { dash: 1 }); pill(s, xx, g.Y(200) + 0.2, nm + " " + d + "%", { fs: 7, fill: c, h: 0.2 }); });
  curve(s, dd.map(([a, b]) => [g.X(a), g.Y(b)]), K.rust, 1.6); dd.forEach(([a, b]) => E(s, g.X(a) - 0.05, g.Y(b) - 0.05, 0.1, 0.1, K.rust, { line: null }));
  curve(s, ee.map(([a, b]) => [g.X(a), g.Y(b)]), "4D6B35", 1.6, { dash: 1 }); ee.forEach(([a, b]) => E(s, g.X(a) - 0.05, g.Y(b) - 0.05, 0.1, 0.1, "4D6B35", { line: null }));
  legend(s, RC.x + 0.72, TOP + 4.22, [[K.rust, "dishing (배선 폭 의존)"], ["4D6B35", "erosion (영역 전체)"]], { cols: 1, cw: 3.0 });
  flagOf(s, p); cap(s, p.note || "두께 방향 확대 표시 · 그래프는 설명용 경향선");
}

// ========== T3. Backside pad 공정 단면 ==========
// p:{step 0..7, defect:'undercut'|'residue'|'none', ox1,sin,ox2,ni_um}
function f_bs(s, p) {
  // notes:false → 개념 주석(희생막·CMP·최종 절연막 구성)을 끄고 결함 지시선 라벨은 "관찰 부위" 로 (f_saw 와 같은 이름)
  // labels:false → 막 이름도 숨긴다(막 1·2·3 + 두께, 공정 순서도 일반 표기) — 막 구성·순서를 묻는 문항용, notes:false 를 포함 (EA_to_DA §17)
  const NL = p.labels === false, NO = p.notes === false || NL;
  const annotTo = (s2, ax, ay, i, text, fill) => annotTo0(s2, ax, ay, i, NO && i > 0 ? "관찰 부위 (A)" : text, NO && i > 0 ? K.cream : fill);
  const annot = (s2, i, text, fill) => { if (!NO) annot0(s2, i, text, fill); };
  const step = p.step == null ? 7 : p.step;
  const x0 = LC.x + 0.1, w = 2.35, sy = TOP + 2.45;            // Si 상면
  R(s, x0, sy, w, 0.95, MX.si, { lw: 0.9, text: "Si", fs: 8 });
  const tsv = [x0 + 0.55, x0 + 1.17, x0 + 1.79], tw2 = 0.22, prot = step >= 1 ? 0 : 0.14;
  tsv.forEach((tx) => { R(s, tx - tw2 / 2 - 0.03, sy, tw2 + 0.06, 0.95, MX.ox, { lw: 0.4 }); R(s, tx - tw2 / 2, sy - prot, tw2, 0.95 + prot, MX.cu, { lw: 0.6 }); });
  // 절연막 적층
  let y = sy; const names = [];
  const lay = (th, c, nm2) => { R(s, x0, y - th, w, th, NL ? K.card2 : c, { lw: 0.65 }); y -= th; names.push([NL ? "막 " + (names.length + 1) + " · " + nm2.replace(/^.* /, "") : nm2, y + th / 2, NL ? K.cream : c]); };
  if (step >= 1) lay(0.13, MX.ox, "SiO2 " + (p.ox1 || 300) + "nm");
  if (step >= 2) lay(0.11, MX.sin, "SiN " + (p.sin || 200) + "nm");
  if (step === 3) lay(0.20, MX.ox2, "희생 SiO2 " + (p.ox2 || 500) + "nm");
  if (step === 3) annot(s, 1, "이 희생 SiO2 는 다음 CMP 에서 전량 제거된다", K.violet);
  // pad 개구 + seed + Ni
  if (step >= 5) tsv.forEach((tx) => R(s, tx - 0.17, y, 0.34, sy - y, MX.bare, { lw: 0.6 }));
  if (step >= 5) tsv.forEach((tx) => {
    poly(s, [[tx - 0.26, y], [tx + 0.26, y], [tx + 0.26, y - 0.04], [tx + 0.21, y - 0.04], [tx + 0.21, sy - 0.04], [tx - 0.21, sy - 0.04], [tx - 0.21, y - 0.04], [tx - 0.26, y - 0.04]], MX.ti, { lw: 0.55 });
    poly(s, [[tx - 0.26, y - 0.04], [tx + 0.26, y - 0.04], [tx + 0.26, y - 0.075], [tx + 0.185, y - 0.075], [tx + 0.185, sy - 0.075], [tx - 0.185, sy - 0.075], [tx - 0.185, y - 0.075], [tx - 0.26, y - 0.075]], MX.cu, { lw: 0.55 });
  });
  if (step === 5) { R(s, x0, y - 0.04, w, 0.04, MX.ti, { lw: 0.35, tr: 30 }); R(s, x0, y - 0.075, w, 0.035, MX.cu, { lw: 0.35, tr: 30 }); }
  if (step >= 6) { tsv.forEach((tx) => R(s, tx - 0.26, y - 0.29, 0.52, 0.215, MX.ni, { lw: 0.75 })); if (step === 6) { R(s, x0, y - 0.04, w, 0.04, MX.ti, { lw: 0.35, tr: 30 }); R(s, x0, y - 0.075, w, 0.035, MX.cu, { lw: 0.35, tr: 30 }); } }
  if (step >= 7 && p.defect === "undercut") {
    tsv.forEach((tx) => { R(s, tx - 0.26, y - 0.075, 0.07, 0.075, MX.bare, { lw: 0.5 }); R(s, tx + 0.19, y - 0.075, 0.07, 0.075, MX.bare, { lw: 0.5 }); });
    annotTo(s, tsv[1] + 0.23, y - 0.04, 1, "seed undercut — Ni pad 가장자리 들뜸", K.pink);
  }
  if (step >= 7 && p.defect === "residue") {
    R(s, x0 + 0.2, y - 0.03, w - 0.4, 0.03, MX.cu, { lw: 0.35, tr: 15 });
    annotTo(s, tsv[1] - 0.45, y - 0.015, 1, "seed residue: pad 사이에 Cu 가 남아 leakage 경로가 된다", K.pink);
  }
  // 좌측 라벨
  names.forEach(([t, yy, c], i) => lead(s, x0 + w - 0.15, yy, x0 + w + 0.18, TOP + 0.3 + i * 0.50, t, { fill: c }));
  if (step >= 5) lead(s, tsv[2] + 0.23, y - 0.05, x0 + w + 0.18, TOP + 0.3 + names.length * 0.50, NL ? "seed 층" : "Ti / Cu seed", { fill: NL ? K.cream : MX.ti });
  if (step >= 6) lead(s, tsv[2] + 0.24, y - 0.2, x0 + w + 0.18, TOP + 0.3 + (names.length + 1) * 0.50, (NL ? "pad 도금 " : "Ni plating ") + (p.ni_um || 2) + " µm", { fill: NL ? K.cream : MX.ni });
  annotTo(s, tsv[0], sy + 0.75, 0, "TSV Cu — reveal 로 뒷면에 드러난 상태", MX.cu);
  if (step === 4) annot(s, 1, "CMP: SiN stop 으로 희생 SiO2 전량 제거", K.mint);
  // 우측: 공정 순서
  const names2 = NL ? ["TSV reveal", "막 1 증착", "막 2 증착", "막 3 증착", "평탄화", "seed 증착", "pad 도금", "seed 제거"]
    : ["TSV reveal", "SiO2 증착", "SiN 증착", NO ? "SiO2 증착 (2차)" : "SiO2 희생막", NO ? "CMP" : "CMP (SiN stop)", "Ti / Cu seed", "Ni plating", "seed etching"];
  ttl(s, "공정 순서", RC.x, TOP - 0.02, 2.0);
  names2.forEach((t, i) => {
    const cur = i === step, yy = TOP + 0.34 + i * 0.44;
    R(s, RC.x, yy, 3.6, 0.36, cur ? K.green : (i < step ? K.card2 : K.sheet), { lw: cur ? 1.3 : 0.7, round: 0.5, text: (i + 1) + ". " + t, fs: 8, bold: cur, align: "left", color: i < step ? K.muted : K.ink });
  });
  annot(s, 2, "최종 절연막 = SiO2 / SiN 2층", K.mint);
  flagOf(s, p); cap(s, p.note || "두께 방향 확대 표시 · 평면 치수 비례 아님");
}

// ========== T4. Bump / UBM / IMC ==========
function f_bump(s, p) {
  const cx = LC.x + 1.5, y = TOP + 0.55, pw = 0.95;
  R(s, LC.x + 0.2, y, 2.6, 0.28, MX.si, { lw: 0.9, text: "upper die", fs: 8 });
  let yy = y + 0.28;
  R(s, cx - pw / 2 - 0.1, yy, pw + 0.2, 0.09, MX.lowk, { lw: 0.6 }); yy += 0.09;
  R(s, cx - pw / 2, yy, pw, 0.11, MX.cu, { lw: 0.7 }); yy += 0.11;
  if (p.niBarrier) { R(s, cx - pw / 2, yy, pw, 0.08, MX.ni, { lw: 0.7 }); yy += 0.08; }
  const imc1 = yy, it = Math.max(0.05, (p.imc_um || 2) * 0.035);
  R(s, cx - pw / 2, yy, pw, it, MX.imc, { lw: 0.7 }); yy += it;
  const st = Math.max(0.14, (p.solder_um || 15) * 0.014), soly = yy;
  R(s, cx - pw / 2, yy, pw, st, MX.sol, { lw: 0.7 }); yy += st;
  R(s, cx - pw / 2, yy, pw, it, MX.imc, { lw: 0.7 }); yy += it;
  if (p.niBarrier) { R(s, cx - pw / 2, yy, pw, 0.08, MX.ni, { lw: 0.7 }); yy += 0.08; }
  const ph = Math.max(0.3, (p.pillar_um || 25) * 0.014), piy = yy;
  R(s, cx - pw / 2, yy, pw, ph, MX.cu, { lw: 0.8, text: "Cu pillar", fs: 8 }); yy += ph;
  R(s, LC.x + 0.2, yy, 2.6, 0.28, MX.si, { lw: 0.9, text: "lower die", fs: 8 });
  // hideLabels(또는 hideResult): 결함 명칭·기구·IMC 상 이름을 숨기고 일반 표기로 (명칭·기구를 묻는 문항용)
  const gen = !!(p.hideLabels || p.hideResult);
  if (p.kirkendall) {
    for (let i = 0; i < 5; i++) E(s, cx - 0.36 + i * 0.17, piy - 0.035, 0.075, 0.055, MX.bare, { lw: 0.6 });
    annotTo(s, cx - 0.36, piy - 0.01, 1, gen ? "관찰된 void (A)" : "Kirkendall void — Cu 측 계면의 공극", K.pink, true);
  }
  if (p.em) {
    A(s, cx + pw / 2 + 0.42, yy - 0.12, cx + pw / 2 + 0.42, imc1 - 0.05, K.rust, 1.6);
    pill(s, LC.x + 0.15, TOP + 0.18, "통전 조건 j = " + (p.j_kA || 15) + " kA/cm²", { fs: 8, fill: K.orange, align: "left" });
    for (let i = 0; i < 4; i++) E(s, cx - pw / 2 + 0.03 + i * 0.055, soly + st * 0.15, 0.05, 0.05, K.rust, { line: null, tr: 25 });
    annotTo(s, cx - pw / 2 + 0.04, soly + st * 0.3, 2, gen ? "결함 위치 (B)" : "current crowding — 모서리 전류 집중", K.pink, true);
  }
  const cP = piy + ph / 2, cS = soly + st / 2, need = 0.44;
  const push = Math.max(0, need - Math.abs(cP - cS));
  dimV(s, LC.x + 2.95, piy, piy + ph, "pillar " + (p.pillar_um || 25) + " µm", { dy: push / 2 });
  dimV(s, LC.x + 2.95, soly, soly + st, "solder " + (p.solder_um || 15) + " µm", { dy: -push / 2 });
  annotTo(s, cx - pw / 2 + 0.06, imc1 + it / 2, 0, "IMC " + (p.imc_um || 2) + (gen ? " µm 계면" : (p.niBarrier ? " µm (Ni₃Sn₄ / (Cu,Ni)₆Sn₅) 계면" : " µm (Cu₆Sn₅ / Cu₃Sn) 계면")), MX.imc, true);
  legend(s, LC.x + 0.35, TOP + 3.05, [[MX.cu, "Cu"], [MX.sol, "solder"], [MX.imc, "IMC"], [MX.ni, p.niBarrier ? "Ni 적용" : "Ni 없음"]], { cols: 4, cw: 1.08 });
  // k 가 없으면 성장 그래프 자체를 그리지 않는다(빈 좌표계 금지 — DA 2026-11-22, 사용자 지적 BUMP-B-0067)
  if (p.k != null) {
  const TM = p.tmax || 1000, YM = p.ymax || 8, q4 = (m) => [0, 1, 2, 3, 4].map((k) => Math.round(m * k / 4 * 100) / 100);
  const g = axes(s, RC.x + 0.68, TOP + 0.95, 2.85, 2.3, {
    xmin: 0, xmax: TM, xticks: q4(TM), ymin: 0, ymax: YM, yticks: q4(YM),
    xlab: "유지 시간 (h) @ " + (p.temp || 150) + " °C", ylab: "IMC 두께 (µm) — 확산 성장",
  });
  const pts = [];
    for (let t = 0; t <= TM; t += TM / 50) pts.push([g.X(t), g.Y(Math.min(YM, p.k * Math.sqrt(t)))]);
    curve(s, pts, K.rust, 1.7);
  pill(s, g.X(TM * 0.62), g.Y(YM * 0.91), "x = k · t^0.5", { fs: 8, fill: K.cream });
  if (p.hours) L(s, g.X(Math.min(TM, p.hours)), g.Y(0), g.X(Math.min(TM, p.hours)), g.Y(YM), K.edge, 1.0, { dash: 1 });
  }
  if (p.k != null || p.bullet) pill(s, RC.x, TOP + 3.95, p.bullet || "IMC 가 두꺼울수록 계면 파괴 확률 증가", { fs: 8, fill: K.violet, align: "left", maxW: RC.w });
  flagOf(s, p); cap(s, p.note || (p.k != null ? "두께 방향 확대 표시 · 그래프는 확산 지배 가정의 경향선" : "두께 방향 확대 표시"));
}

// ========== T5. Sawing / dicing 단면 ==========
function f_saw(s, p) {
  // notes:false → 개념 주석(annot)과 기본 bullet 을 끄고, 지시선 라벨은 "관찰 부위 (A/B)" 로 (개념 정답 노출 방지)
  const NO = p.notes === false, LBL = ["관찰 부위 (A)", "관찰 부위 (B)"];
  const annotTo = (s2, ax, ay, i, text, fill) => annotTo0(s2, ax, ay, i, NO ? LBL[i] || LBL[0] : text, NO ? K.cream : fill);
  const annot = (s2, i, text, fill) => { if (!NO) annot0(s2, i, text, fill); };
  const m = p.method || "blade", x0 = LC.x + 0.1, w = 4.1, top = TOP + 0.75, siH = 1.6;
  R(s, x0, top, w, 0.16, MX.lowk, { lw: 0.8 });
  R(s, x0, top + 0.16, w, 0.1, MX.ox, { lw: 0.6 });
  R(s, x0, top + 0.26, w, siH, MX.si, { lw: 0.9 });
  T(s, "Si", x0 + 0.3, top + 0.26 + siH * 0.3, 1.0, 0.24, { fs: 8, bold: true, color: K.ink2, align: "center", valign: "middle" });   // 절단선(가운데)과 지시선을 피해 왼쪽 위에
  const cx = x0 + w / 2, kerf = Math.max(0.1, (p.kerf_um || 40) * 0.0045), bot = top + 0.26 + siH;
  const cut = (x1, x2, y1, y2, c) => R(s, x1, y1, x2 - x1, y2 - y1, c || MX.bare, { lw: 0.8 });
  const haz = (x1, x2, y1, y2) => R(s, x1, y1, x2 - x1, y2 - y1, MX.hot, { lw: 0.5, tr: 45 });
  if (m === "blade") {
    cut(cx - kerf / 2, cx + kerf / 2, top, bot);
    [-1, 1].forEach((sgn) => poly(s, [[cx + sgn * kerf / 2, top], [cx + sgn * (kerf / 2 + 0.17), top], [cx + sgn * kerf / 2, top + 0.16]], MX.bare, { lw: 0.8 }));
    poly(s, [[cx - kerf / 2, bot], [cx - kerf / 2 - 0.19, bot], [cx - kerf / 2, bot - 0.13]], MX.bare, { lw: 0.8 });
    annotTo(s, cx + kerf / 2 + 0.13, top + 0.04, 0, "top chipping " + (p.chip_um || 25) + " µm — 상부막이 뜯겨 나간다", K.pink);
    annotTo(s, cx - kerf / 2 - 0.15, bot - 0.06, 1, "back-side chipping — 뒷면 모서리 결손", K.pink);
  } else if (m === "lg") {
    cut(cx - kerf / 2 - 0.09, cx + kerf / 2 + 0.09, top, top + 0.26);
    haz(cx - kerf / 2 - 0.17, cx - kerf / 2 - 0.09, top, top + 0.26); haz(cx + kerf / 2 + 0.09, cx + kerf / 2 + 0.17, top, top + 0.26);
    cut(cx - kerf / 2, cx + kerf / 2, top + 0.26, bot);
    annotTo(s, cx + kerf / 2 + 0.14, top + 0.12, 0, "laser grooving 으로 상부막 선제거 · HAZ " + (p.haz_um || 5) + " µm", K.orange);
    annotTo(s, cx + kerf / 2, bot - 0.35, 1, "홈을 낸 뒤 blade 로 Si 를 절단한다", K.cream);
  } else if (m === "stealth") {
    for (let i = 0; i < 5; i++) E(s, cx - 0.045, top + 0.42 + i * 0.21, 0.09, 0.1, MX.hot, { lw: 0.6 });
    L(s, cx, top + 0.3, cx, bot, K.edge, 0.8, { dash: 1 });
    R(s, x0, bot, w, 0.11, MX.tape, { lw: 0.8, text: "expansion tape", fs: 8 });
    A(s, cx - 0.45, bot + 0.26, cx - 1.1, bot + 0.26, K.rust, 1.4); A(s, cx + 0.45, bot + 0.26, cx + 1.1, bot + 0.26, K.rust, 1.4);
    annotTo(s, cx + 0.05, top + 0.85, 0, "modified layer — Si 내부에만 개질층을 만든다", K.orange);
    annot(s, 1, "tape expansion 으로 분리 · kerf 손실 없음", K.mint);
  } else if (m === "plasma") {
    cut(cx - kerf / 2, cx + kerf / 2, top + 0.26, bot);
    cut(cx - kerf / 2 - 0.04, cx + kerf / 2 + 0.04, top, top + 0.26);
    annotTo(s, cx + kerf / 2, top + 0.85, 0, "수직 측벽 · HAZ 없음 · kerf " + (p.kerf_um || 10) + " µm", K.mint);
    annot(s, 1, "scribe lane 금속은 Si 식각으로 안 걷힌다", K.pink);
  } else if (m === "deeplaser") {
    cut(cx - kerf / 2, cx + kerf / 2, top, bot - 0.18);
    haz(cx - kerf / 2 - 0.12, cx - kerf / 2, top, bot - 0.18); haz(cx + kerf / 2, cx + kerf / 2 + 0.12, top, bot - 0.18);
    annotTo(s, cx + kerf / 2 + 0.1, top + 0.8, 0, "HAZ " + (p.haz_um || 12) + " µm · 재응고층이 측벽에 남는다", K.orange);
    annot(s, 1, "열영향부가 깊어 측벽 강도가 낮아진다", K.pink);
  } else if (m === "dbg") {
    cut(cx - kerf / 2 - 0.07, cx + kerf / 2 + 0.07, top, top + 0.8);
    R(s, x0, bot - 0.32, w, 0.32, MX.si2, { lw: 0.7, tr: 20 });
    A(s, x0 + 0.3, bot + 0.26, x0 + w - 0.3, bot + 0.26, K.rust, 1.4, { both: true });
    annot(s, 1, "half-cut 후 backgrinding 으로 개별화한다", K.mint);
    annotTo(s, cx + kerf / 2 + 0.1, top + 0.4, 0, "half-cut 깊이", K.cream);
  }
  dimH(s, cx - kerf / 2, cx + kerf / 2, top - 0.80, "kerf " + (p.kerf_um || 40) + " µm");
  lead(s, x0 + 0.45, top + 0.08, x0 + 0.45, top - 0.26, "low-k ILD / passivation", { fill: MX.lowk, align: "left" });
  const rows = [["방식", "kerf", "HAZ", "상부막 손상"],
    ["blade", "30–60 µm", "없음", "chipping 큼"],
    ["laser grooving + blade", "30–50 µm", "수 µm", "작음"],
    ["stealth", "분리식 (0)", "내부 개질층", "없음"],
    ["plasma", "5–15 µm", "없음", "없음"],
    ["deep laser", "20–40 µm", "10 µm 이상", "작음"]];
  rows.push(["DBG (half-cut → BG)", "blade 폭", "없음", "blade 와 비슷"]);
  const keymap = { blade: 1, lg: 2, stealth: 3, plasma: 4, deeplaser: 5, dbg: 6 }, tH = 0.32 + rows.length * 0.52;

  pill(s, RC.x, TOP + 3.5, msg[0], { fs: 8, fill: msg[1], align: "left", maxW: RC.w });
  if (p.bullet) pill(s, RC.x, TOP + 3.95, p.bullet, { fs: 8, fill: K.card2, align: "left", maxW: RC.w });
  flagOf(s, p); cap(s, p.note || "두께 방향 확대 표시 · 평면 비례 근사");
}

// ========== T9. 열 경로 / 층별 ΔT ==========
function f_therm(s, p) {
  // n = base 포함 총 die 수. core(=core die 수)를 주면 n = core + 1. hideResult 이면 계산 결과(온도·ΔT·R)를 '?' 로 둔다.
  const n = p.core ? p.core + 1 : (p.n || 12), q = p.q_Wmm2 == null ? 0.2 : p.q_Wmm2, hid = !!p.hideResult;
  const layers = p.layers || [["Si (die)", 30, 120], ["BEOL", 6, 3], ["bond layer", 9, 0.6]];
  const Rth = layers.reduce((a, l) => a + (l[1] * 1e-6) / l[2], 0), dT = q * 1e6 * Rth;
  const hotc = (f) => { const c = [[0.80, 0.86, 0.91], [0.99, 0.90, 0.72], [0.96, 0.66, 0.54], [0.84, 0.36, 0.26]];
    const t = Math.max(0, Math.min(0.999, f)) * 3, i = Math.floor(t), r = t - i, a = c[i], b = c[Math.min(3, i + 1)];
    return a.map((v, k2) => Math.round((v + (b[k2] - v) * r) * 255).toString(16).padStart(2, "0")).join("").toUpperCase(); };
  const avail = 4.1, dieH = Math.min(0.2, (avail - 0.3) / n * 0.7), gap = Math.min(0.1, (avail - 0.3) / n * 0.3);
  const x0 = LC.x + 0.25, top = TOP + 0.62, tt = [];
  ttl(s, "적층 방향 온도 — core " + (n - 1) + " + base 1", LC.x, TOP - 0.04, 4.3);
  const tMin = p.tTop || 95, tMax = tMin + dT * (n - 1);
  for (let i = 0; i < n; i++) {
    const Ti = tMin + dT * i; tt.push(Ti);
    const yy = top + i * (dieH + gap);
    R(s, x0, yy, 2.45, dieH, hid ? (i === 0 ? MX.cold : (i === n - 1 ? MX.hot : "F3E2CF")) : hotc((Ti - tMin) / Math.max(1e-6, tMax - tMin + 1e-6)), { lw: 0.7, text: (i === n - 1 ? "base die" : "core " + (n - 1 - i)) + "   " + (hid && i > 0 ? "?" : Ti.toFixed(1)) + " °C", fs: 8 });
    if (i < n - 1) R(s, x0, yy + dieH, 2.45, gap, MX.ncf, { lw: 0.35 });
  }
  R(s, x0 - 0.1, top - 0.26, 2.65, 0.24, MX.cold, { lw: 0.9, text: "TIM / lid (방열)", fs: 8 });
  A(s, x0 + 2.62, top + n * (dieH + gap) - 0.1, x0 + 2.62, top - 0.08, K.rust, 1.5);
  pill(s, x0 + 2.7, top + n * (dieH + gap) / 2, "열 흐름 (위로)", { fs: 8, fill: K.orange, align: "left" });
  
  const rows = [["층", "두께 (µm)", "k (W/mK)", "R (m²K/W)"]]
    .concat(layers.map((l) => [l[0], String(l[1]), String(l[2]), hid ? "?" : ((l[1] * 1e-6) / l[2]).toExponential(2)]))
    .concat([["합계", "", "", hid ? "?" : Rth.toExponential(2)]]);
  table(s, rows, RC.x, TOP, RC.w, rows.length - 1);
  pill(s, RC.x, TOP + 0.32 + rows.length * 0.60 + 0.34, "q = " + q + " W/mm² → ΔT " + (hid ? "?" : dT.toFixed(2)) + " K", { fs: 8, fill: K.orange, align: "left", maxW: RC.w });
  pill(s, RC.x, TOP + 0.32 + rows.length * 0.60 + 0.81, "base die " + (hid ? "?" : tt[n - 1].toFixed(1)) + " °C · 상한 " + (p.limit || 85) + " °C", { fs: 8, fill: hid ? K.cream : (tt[n - 1] > (p.limit || 85) ? K.pink : K.mint), align: "left", maxW: RC.w });
  if (!hid) pill(s, RC.x, TOP + 0.32 + rows.length * 0.60 + 1.28, "간극 수 = core die 수 (" + (n - 1) + "개)", { fs: 8, fill: K.violet, align: "left", maxW: RC.w });
  flagOf(s, p); cap(s, p.note || "1D 정상상태 · 측면 확산 무시 · 물성은 문항 제시값");
}

// ========== T10. FA 기법 결과 ==========
function f_fa(s, p) {
  const t = p.tech || "lit";
  if (t === "lit" || t === "obirch") {
    const x0 = LC.x + 0.2, y0 = TOP + 0.3;

    const hx = x0 + 2.9 * ((p.hot && p.hot[0]) || 0.62), hy = y0 + 2.2 * ((p.hot && p.hot[1]) || 0.4);

    const ix = RC.x, iy = TOP + 3.3;

    for (let i = 0; i < 4; i++) R(s, ix, iy + i * 0.215, 2.9, 0.215, i === 2 ? MX.lowk : MX.ox, { lw: 0.4, tr: 30 });
    E(s, ix + 1.45, iy + 0.48, 0.1, 0.1, K.alert, { line: null });
    lead(s, ix + 1.5, iy + 0.52, ix + 2.88, iy + 1.0, "추정 깊이 " + (p.depth || 20) + " µm", { fill: K.pink, align: "right" });
  } else if (t === "eotpr") {
    ttl(s, "EOTPR 반사 파형 → 전기 길이로 결함 위치 추정", LC.x, TOP - 0.04, 5.0);
    const g = axes(s, LC.x + 0.74, TOP + 0.7, 3.55, 2.00, {
      xmin: 0, xmax: 120, xticks: [0, 30, 60, 90, 120], ymin: -50, ymax: 100, yticks: [-50, 0, 50, 100],

    const feats = p.feats || [[22, 28, "C4 bump"], [48, -24, "TSV 진입"], [86, 52, "open 결함"]];
    const pts = []; for (let i = 0; i <= 120; i++) { let v = 0; feats.forEach((f) => { v += f[1] * Math.exp(-Math.pow((i - f[0]) / 4.5, 2)); }); pts.push([g.X(i), g.Y(Math.max(-50, Math.min(100, v)))]); }
    curve(s, pts, K.rust, 1.6);
    // 위치 표식 점선을 먼저 모두 긋고, 이름 pill 은 파형 봉우리(≤ 60 mV) 위 빈 띠(70–100 mV)에 얹는다
    feats.forEach((f) => L(s, g.X(f[0]), g.Y(-50), g.X(f[0]), g.Y(100), K.edge, 0.7, { dash: 1 }));
    feats.forEach((f, i) => pill(s, Math.min(g.X(f[0]), LC.x + 3.9), g.Y(100) + 0.17 + (i % 2) * 0.24, f[2], { fs: 8, fill: K.yellow }));
    annot(s, 0, "패키지 내부 미세 경로는 분해능이 높은 EOTPR 로 본다", K.violet);
    ttl(s, "구조 대응", RC.x, TOP - 0.04, 2.0);
    // 두께 방향을 키운 단면(uz 0.16): interposer 이름이 자기 층 안에 들어간다
    const Q = OBL(RC.x + 0.15, TOP + 3.0, 0.1, 0.16);
    oblBox(s, Q, 0, 0, 0, 30, 5, 2, M.sub, { lw: 0.7, text: "substrate", fs: 8 });

      pill(s, bx, y0 + 1.42, "slice " + (k + 1) + " · z " + (k * (p.dz || 15)) + " µm", { fs: 8, fill: k === 1 ? K.pink : K.cream, align: "left", maxW: 1.3 });

    pill(s, LC.x, y0 + 2.75, "분해능 한계: 수백 nm급 미접합은 구분 불가", { fs: 8, fill: K.card2, align: "left", maxW: LC.w });
    const g = axes(s, RC.x + 0.68, TOP + 0.65, 2.85, 2.4, {
      xmin: 0, xmax: 45, xticks: [0, 15, 30, 45], ymin: 0, ymax: 100, yticks: [0, 25, 50, 75, 100],
      xlab: "z 위치 (µm)", ylab: "void 면적비 (%)",
    });
    const pts = []; for (let z = 0; z <= 45; z++) pts.push([g.X(z), g.Y(100 * Math.exp(-Math.pow((z - (p.zpeak || 15)) / 6, 2)))]);
    curve(s, pts, K.rust, 1.6);
    L(s, g.X(p.zpeak || 15), g.Y(0), g.X(p.zpeak || 15), g.Y(100), K.edge, 0.9, { dash: 1 });
    pill(s, clampX(g.X(p.zpeak || 15), 0.7), g.Y(100) + 0.26, "z = " + (p.zpeak || 15) + " µm", { fs: 8, fill: K.yellow });
  }
  flagOf(s, p); cap(s, p.note || "map · 파형은 설명용 모델 · 실측 데이터 아님");
}

// ========== T11. 신뢰성 시험 순서 ==========
function f_rel(s, p) {
  const x0 = LC.x + 0.1, y0 = TOP + 0.3;
  const seq = p.seq || [["JESD22-A113", "MSL preconditioning", "J-STD-020 리플로 × 3회"], ["JESD22-A104", "Temperature Cycling", "cond. B (−55/+125 °C) × " + (p.tcCycles || 700)], ["JESD22-A118", "uHAST", "130 °C / 85% RH, 96 h"], ["JESD22-A103", "HTS", "150 °C, 1000 h"]];
  ttl(s, "시험 순서 (preconditioning이 먼저)", LC.x, TOP - 0.04, 4.3);

    R(s, x0, yy, 4.2, 0.72, i === (p.cur == null ? -1 : p.cur) ? K.green : K.card, { lw: i === p.cur ? 1.3 : 0.8, round: 0.25 });
    T(s, r[0], x0 + 0.12, yy + 0.08, 1.6, 0.26, { fs: 8, bold: true, color: K.rust });
    T(s, r[1], x0 + 1.85, yy + 0.06, 2.2, 0.26, { fs: 8, bold: true });
    T(s, r[2], x0 + 1.85, yy + 0.38, 2.2, 0.26, { fs: 8, color: K.muted });
    if (i < seq.length - 1) A(s, x0 + 0.8, yy + 0.72, x0 + 0.8, yy + 0.84, K.edge, 1.1);
  });
  pill(s, LC.x, y0 + seq.length * 0.85 + 0.25, p.hint || "precondition 생략 시 실장 열이력 미반영", { fs: 8, fill: K.violet, align: "left" });
  const XM = p.xmax || 1000, YM = p.ymax || 10, q4 = (m) => [0, 1, 2, 3, 4].map((k) => Math.round(m * k / 4 * 100) / 100);
  const g = axes(s, RC.x + 0.68, TOP + 0.7, 2.85, 2.35, {
    xmin: 0, xmax: XM, xticks: q4(XM), ymin: 0, ymax: YM, yticks: q4(YM),

  const fails = p.fails || [[250, 0.2], [500, 0.9], [750, 2.6], [1000, 6.4]];
  curve(s, [[g.X(0), g.Y(0)]].concat(fails.map((f) => [g.X(f[0]), g.Y(f[1])])), K.rust, 1.7);
  L(s, g.X(0), g.Y(p.crit || 1), g.X(XM), g.Y(p.crit || 1), "4D6B35", 1.1, { dash: 1 });
  // TC 축일 때 규격 cycle 수(기본 JESD22-A104 cond. B 700 cycle)를 세로 점선으로
  const tcC = p.tcCycles || 700;
  if (!p.xlab && tcC <= XM) { L(s, g.X(tcC), g.Y(0), g.X(tcC), g.Y(YM), K.edge, 0.9, { dash: 1 }); pill(s, g.X(tcC), g.Y(YM * 0.62), "규격 " + tcC + " cycle", { fs: 7, h: 0.2, fill: K.cream, axis: "y" }); }
  // 고장률 점·값 라벨은 기준선·규격선 위에 그린다 (선이 글자를 가로지르지 않게)
  fails.forEach((f) => E(s, g.X(f[0]) - 0.05, g.Y(f[1]) - 0.05, 0.1, 0.1, K.rust, { line: null }));
  fails.forEach((f, i) => { pill(s, g.X(f[0]) - (i === fails.length - 1 ? 0.3 : 0), g.Y(f[1]) - 0.22 - (i % 2) * 0.34, f[1] + "%", { fs: 8, fill: K.cream }); });
  pill(s, g.X(0) + 0.08, g.Y(YM) + 0.22, "판정 기준선 (사내) " + (p.crit || 1) + "%", { fs: 8, fill: K.green, align: "left" });

}

// ========== T12. 전체 stack isometric ==========
function f_stack(s, p) {
  const n = p.n || 12, u = 0.12;
  const P = ISO(LC.x + 1.5, TOP + 2.1, u, 1.0);
  const dieT = 13.5 / (n * 1.5), gapT = dieT * 0.5;
  isoBox(s, P, 0, 0, 0, 11, 12.8, 0.5, p.highlight === "base" ? K.pink : M.base, { lw: p.highlight === "base" ? 1.3 : 0.9 });
  let z = 0.5;
  for (let i = 0; i < n; i++) {
    const hl = (p.highlight === "topcore" && i === n - 1) ||
               (p.highlight === "midcore" && i === Math.floor(n / 2));
    isoBox(s, P, 0, 0, z, 11, 12.8, gapT, hl ? K.pink : MX.ncf, { lw: 0.4 }); z += gapT;
    isoBox(s, P, 0, 0, z, 11, 12.8, dieT, hl ? K.pink : M.dram, { lw: hl ? 1.3 : 0.5 }); z += dieT;
  }
  let a = P(11, 6, z); lead(s, a[0], a[1], LC.x + 2.6, TOP + 0.02, "core die " + n + "장", { fill: p.highlight === "topcore" ? K.pink : M.dram });
  a = P(11, 6, 0.25); lead(s, a[0], a[1], LC.x + 2.7, TOP + 2.9, "base die 1장", { fill: M.base });
  const hid = !!p.hideResult;
  // 수치는 params 에 준 것만 그린다 (EA_to_DA §16: 기본 간극 7 µm·기본 높이·기본 상한 775 µm 를 지어내지 않음)
  a = P(0, 12.8, 0.5 + gapT / 2); annotTo(s, a[0], a[1], 0, "접합 간극 " + (hid ? "?" : n) + "개" + (p.gap_um != null ? " · 각 " + p.gap_um + " µm" : ""), MX.ncf);
  if (p.highlight === "topcore") annot(s, 1, "최상단 core die 에는 backside pad 가 없다", K.pink);
  else if (p.highlight === "midcore") annot(s, 1, "중간 core die 는 위아래를 모두 이어야 한다", K.pink);
  else if (p.highlight === "gap") annot(s, 1, hid ? "접합 간극은 어디에 몇 개 생기는가" : "접합 간극 수 = core die 수", MX.ncf);
  else if (p.highlight === "base") annot(s, 1, "base die 가 외부 인터페이스를 담당한다", M.base);
  else if (p.highlight === "height") annot(s, 1, "전체 높이 = die 두께 합 + 간극 합", K.violet);
  const HF = hid || p.hideFormula === true; // hideResult 면 산식 칸도 숨김(산식이 곧 정답, DA 2026-11-22)
  const rows = [["항목", "수량", "산식"],
    ["die 총 장수", hid ? "?" : (n + 1) + "장", HF ? "?" : "core " + n + " + base 1"],
    ["접합 간극", hid ? "?" : n + "개", HF ? "?" : "= core 수 (base–core1 포함)"],
    ["backside pad 보유 die", hid ? "?" : n + "장", HF ? "?" : "base + core, top core 제외"],
    ["스택 높이", hid ? "?" : (p.h_um != null ? p.h_um + " µm" : "—"), HF ? "?" : "base + N × (core + 간극)"]];
  table(s, rows, RC.x, TOP, RC.w, null);
  const hasLim = p.limit_um != null;
  if (hasLim) pill(s, RC.x, TOP + 0.32 + rows.length * 0.60 + 0.32, "높이 상한 (설계 조건) " + p.limit_um + " µm", { fs: 8, fill: hid || p.h_um == null ? K.cream : (p.h_um > p.limit_um ? K.pink : K.mint), align: "left", maxW: RC.w });
  if (p.bullet) pill(s, RC.x, TOP + 0.32 + rows.length * 0.60 + (hasLim ? 0.84 : 0.32), p.bullet, { fs: 8, fill: K.violet, align: "left", maxW: RC.w });
  flagOf(s, p); cap(s, p.note || "두께 방향 확대 표시 · 평면 치수 비례");
}

// ========== T13. HCB 정렬 / dishing ==========
function f_hcb(s, p) {

// ========== T17. Wafer map (불량 · 두께 · TTV 분포) ==========
// p:{title, grid 9–25, values:[[…]] (grid×grid, null=칩 없음) | pattern: edge·center·ring·notch·random·quadrant,
//    scale:{min,max,unit}, bin: true(합/불 2색), marks:[[col,row,라벨]], bullets:[…] (≤3)}
function f_wafermap(s, p) {
  const N = Math.max(9, Math.min(25, p.grid || 15)), sc = p.scale || { min: 0, max: 100, unit: "" };
  const R0 = 2.05, cx = LC.x + 2.2, cy = TOP + 2.35, cell = 2 * R0 / N;
  const hash = (i, j) => { const v = Math.sin(i * 12.9898 + j * 78.233 + (p.seed || 0) * 3.7) * 43758.5453; return v - Math.floor(v); };
  const pat = (rr, mx, my, i, j) => { switch (p.pattern) {
    case "center": return 1 - rr * rr; case "ring": return Math.exp(-Math.pow((rr - 0.62) / 0.16, 2));
    case "notch": return Math.max(0, 1 - Math.hypot(mx, my - R0) / R0 * 0.9);
    case "quadrant": return (mx > 0 && my < 0) ? 0.85 : 0.12;
    case "random": return hash(i, j) > 0.86 ? 1 : 0.05;
    default: return Math.pow(rr, 4); } };
  const ramp = (f) => { const c = [[0.79, 0.86, 0.93], [0.99, 0.93, 0.74], [0.96, 0.66, 0.52], [0.80, 0.30, 0.22]];
    const t = Math.max(0, Math.min(0.999, f)) * 3, k = Math.floor(t), r = t - k, a = c[k], b = c[Math.min(3, k + 1)];
    return a.map((v, q) => Math.round((v + (b[q] - v) * r) * 255).toString(16).padStart(2, "0")).join("").toUpperCase(); };

  E(s, cx - R0 - 0.08, cy - R0 - 0.08, 2 * R0 + 0.16, 2 * R0 + 0.16, "E9E4DC", { lw: 1.0 });
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const x = cx - R0 + i * cell, y = cy - R0 + j * cell, mx = x + cell / 2 - cx, my = y + cell / 2 - cy, rr = Math.hypot(mx, my) / R0;
    if (Math.hypot(Math.abs(mx) + cell / 2, Math.abs(my) + cell / 2) > R0 + cell * 0.15) continue;
    let v = p.values && p.values[j] ? p.values[j][i] : null;
    if (p.values && v == null) continue;
    // bin 모드에서 scale 을 주지 않으면 values 는 0/1 (불량 = 1) 그대로 쓴다
    const f = v != null ? (p.bin && !p.scale ? v : (v - sc.min) / ((sc.max - sc.min) || 1)) : pat(rr, mx, my, i, j);
    const fill = p.bin ? (f >= 0.5 ? "D0683A" : "CFE3B2") : ramp(f);
    R(s, x + 0.008, y + 0.008, cell - 0.016, cell - 0.016, fill, { lw: 0.3, line: "8B847A" });
  }

  T(s, "notch", cx + 0.16, cy + R0 - 0.08, 0.8, 0.2, { fs: 7, color: K.muted });
  (p.marks || []).slice(0, 4).forEach((m, k) => { const ax = cx - R0 + (m[0] + 0.5) * cell, ay = cy - R0 + (m[1] + 0.5) * cell;
    E(s, ax - 0.06, ay - 0.06, 0.12, 0.12, null, { lw: 1.6, line: K.alert });
    lead(s, ax + 0.06, ay, LC.x + 4.45, TOP + 0.35 + k * 0.48, m[2], { fill: K.pink, align: "right", nogut: true }); });
  // 오른쪽: 제목 · 색 막대 · 요점
  ttl(s, p.title || "wafer map", RC.x, TOP - 0.04, RC.w);
  if (p.bin) legend(s, RC.x, TOP + 0.4, [["CFE3B2", "합격 die"], ["D0683A", "불량 die"]], { cols: 2, cw: 1.6 });
  else {
    const bx = RC.x, by = TOP + 0.45, bw = 2.9;
    for (let k = 0; k < 24; k++) R(s, bx + bw * k / 24, by, bw / 24 + 0.004, 0.2, ramp(k / 23), { line: null });
    R(s, bx, by, bw, 0.2, null, { lw: 0.7 });
    T(s, String(sc.min), bx - 0.2, by + 0.24, 0.6, 0.2, { fs: 7, color: K.muted, align: "left" });
    T(s, String(sc.max) + (sc.unit ? " " + sc.unit : ""), bx + bw - 0.9, by + 0.24, 1.1, 0.2, { fs: 7, color: K.muted, align: "right" });
  }
  let by2 = TOP + 1.2;
  (p.bullets || []).slice(0, 3).forEach((t, i) => { const raw = tw(t, 8 * 1.52) * 1.08 + 0.40, ln = Math.max(1, Math.ceil(raw / RC.w)), hh = 0.24 * 1.52 * (1 + 0.84 * (ln - 1));
    pill(s, RC.x, by2 + hh / 2, t, { fs: 8, fill: i === 0 ? K.violet : K.card2, align: "left", maxW: RC.w }); by2 += hh + 0.14; });
  flagOf(s, p); cap(s, p.note || "die 격자는 위에서 본 평면 · 색은 문항 제시값 또는 분포 유형의 설명용 모델");
}

    if (!n) return 0;

    return t.symbols[sum + cur];

    const cands = [R0];
    const side = [[b.l,cy],[b.r,cy]], tb = [[cx,b.t],[cx,b.b],[b.l+rr,b.t],[b.r-rr,b.t],[b.l+rr,b.b],[b.r-rr,b.b]];
    side.concat(tb).forEach(E=>cands.push([[ax,ay],E]));
    side.forEach(E=>{ cands.push([[ax,ay],[ax,E[1]],E]);
      const chs = E[0]===b.l ? [b.l-8, b.l-16] : [b.r+8, b.r+16];
      chs.forEach(ch=>{ cands.push([[ax,ay],[ch,ay],[ch,E[1]],E]); }); });
    tb.forEach(E=>{ cands.push([[ax,ay],[E[0],ay],E]); });
    let best = R0, bc = c0;
    cands.forEach(R=>{ if (R.some((p,i)=>i && Math.hypot(p[0]-R[i-1][0],p[1]-R[i-1][1])<0.5)) return; const c = route(R); if (c < bc - 20) { bc = c; best = R; } });
    if (best === R0) return;
    l.setAttribute("data-pre", [ax,ay,ex0,ey0].join(","));
    l.setAttribute("x2", best[1][0]); l.setAttribute("y2", best[1][1]);
    let prev = l;
    for (let i=2;i<best.length;i++) { const n = l.cloneNode(false); n.removeAttribute("data-pre"); n.setAttribute("data-seg","1");
      n.setAttribute("x1", best[i-1][0]); n.setAttribute("y1", best[i-1][1]); n.setAttribute("x2", best[i][0]); n.setAttribute("y2", best[i][1]);
      prev.after(n); prev = n; }
  }));
}

function lineChart(pts){
  const W=860,H=230,L=58,R=28,T=34,B=48, cw=W-L-R, ch=H-T-B;
  const nx=Math.max(2, pts.length), X=i=>pts.length===1 ? L+cw/2 : L+cw*i/(nx-1), Y=v=>T+ch-ch*v/100;
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="회차별 득점률">`;
  for(let t=0;t<=100;t+=25){ g+=`<line class="gl" x1="${L}" y1="${Y(t)}" x2="${L+cw}" y2="${Y(t)}"/>`;
    g+=`<text class="tk" x="${L-9}" y="${Y(t)+4}" text-anchor="end">${t}</text>`; }
  const step = Math.ceil(pts.length/16);
  pts.forEach((p,i)=>{ if (i % step === 0 || i === pts.length-1) g+=`<text class="tk" x="${X(i)}" y="${T+ch+18}" text-anchor="middle">${i+1}</text>`; });
  g+=`<line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${T+ch}"/><line class="ax" x1="${L}" y1="${T+ch}" x2="${L+cw}" y2="${T+ch}"/>`;
  g+=`<text class="tl" x="${L+cw/2}" y="${T+ch+40}" text-anchor="middle">회차</text>`;
  g+=`<text class="tl" x="${L-48}" y="${T-16}">득점률 (%)</text>`;
  if(pts.length){ let d=""; pts.forEach((p,i)=>{ d += (i?"L":"M")+X(i)+","+Y(p.pct); });
    g+=`<path class="ln" d="${d}"/>`;
    pts.forEach((p,i)=>{ g+=`<circle class="pt" cx="${X(i)}" cy="${Y(p.pct)}" r="4.5"/>`;
      g+=`<text class="pv" x="${X(i)+(i===0&&pts.length>1?8:0)}" y="${Y(p.pct)-11}" text-anchor="${i===0&&pts.length>1?"start":"middle"}">${p.pct.toFixed(0)}</text>`; }); }
  return g+"</svg>";
}

function sideHTML(curIdx){
  const doms = domains(), tot = active().length, done = active().filter(o=>answers[o.i]!=null).length;
  const lst = active(), gate = lst.findIndex(o=>answers[o.i]==null);
  const locked = (i)=> !graded && gate >= 0 && lst.findIndex(o=>o.i===i) > gate;
  let h = `<h3><span>출제 범위</span><span>${doms.length}개 영역 · ${tot}문항</span></h3>`;
  doms.forEach(([dom, list])=>{
    const n = list.filter(o=>answers[o.i]!=null).length, open = list.some(o=>o.i===curIdx);
    h += `<div class="les${open?" open":""}"><button type="button" data-go="q${list[0].i}"><span class="sq" style="background:${domColor(dom)}"></span>${esc(dom)}<span class="cnt${n===list.length?" done":""}">${n}/${list.length}</span></button>
      <ul class="steps">${list.map((o,k)=>{
        const a=answers[o.i], mark = graded ? (a===o.q.a?"✓":"✕") : (a!=null?"●":"·");
        const lk = locked(o.i), ck = graded ? (a===o.q.a?" g-ok":" g-no") : (a!=null?" a":"");
        return `<li><button type="button" ${lk?'disabled style="opacity:.42"':`data-go="q${o.i}"`}${o.i===curIdx?' aria-current="step"':''}><span class="ck${ck}" aria-hidden="true">${lk?"·":mark}</span><span>${k+1}. ${esc(o.q.title)}</span></button></li>`;}).join("")}</ul></div>`;
  });
  h += `<button class="refbtn" type="button" data-go="result">결과 보기</button>
        <button class="refbtn" type="button" data-go="start">시험 구성 다시 하기</button>
        <div class="prog"><span>응답</span><span>${done} / ${tot}</span></div>`;
  document.getElementById("topProg").textContent = `${done} / ${tot} 문항`; setProg(tot ? done / tot : 0);
  document.getElementById("modeChip").textContent = graded ? "채점 완료" : "응시 중";
  document.getElementById("modeChip").style.background = graded ? "var(--orange)" : "var(--green)";
  return h;
}
