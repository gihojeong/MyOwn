<title>HBM 이해도 평가</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Noto+Sans+KR:wght@400;600;800&display=swap">
<style>/* Layout: course sidebar | step canvas (metrics + isometric drawing + timeline) | explanation panel — paper-sheet look */
:root {
  --paper: #f4ebe0; --card: #f8f0e6; --card2: #f6eee3; --line: #ddd3c5; --line-strong: #c6bbac;
  --ink: #1d1b18; --ink2: #34302b; --muted: #6f6961; --edge: #3a3530;
  --green: #cfe3b2; --green-ink: #2f5a1e; --violet: #ece3f6; --violet-line: #d5c8e2; --orange: #fcdcbd; --rust: #c8552a; --blue: #cfe0f5; --pink: #f6d3d0; --mint: #dff0de;
  --sheet: #f9f2e8; --sheet-grid: #ebe2d5; --sheet-ink: #1d1b18;
  --mono: "JetBrains Mono", "Noto Sans KR", ui-monospace, Menlo, monospace;
  --sans: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
  --shadow: 1.5px 2.5px 0 #46413b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1c1915; --card: #25211c; --card2: #2b2620; --line: #3a342c; --line-strong: #4d453b;
  --ink: #f1e9dd; --ink2: #ddd3c5; --muted: #a39a8e; --edge: #d9cfc1;
  --green: #4d6b35; --green-ink: #d6ebc0; --violet: #362e44; --violet-line: #4e4260; --orange: #6a4428; --rust: #ef8a5c; --blue: #2c3d55; --pink: #5a3330; --mint: #2f4a33;
  --shadow: 1.5px 2.5px 0 #000; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #1c1915; --card: #25211c; --card2: #2b2620; --line: #3a342c; --line-strong: #4d453b;
  --ink: #f1e9dd; --ink2: #ddd3c5; --muted: #a39a8e; --edge: #d9cfc1;
  --green: #4d6b35; --green-ink: #d6ebc0; --violet: #362e44; --violet-line: #4e4260; --orange: #6a4428; --rust: #ef8a5c; --blue: #2c3d55; --pink: #5a3330; --mint: #2f4a33;
  --shadow: 1.5px 2.5px 0 #000; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--sans); font-size: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 24px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
.top { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-weight: 800; font-size: 15px; }
.top .sp { flex: 1; }
.chip { font-family: var(--mono); font-size: 11.5px; font-weight: 600; border: 1px solid var(--edge); border-radius: 99px; padding: 3px 10px; background: var(--card); white-space: nowrap; }
.iconbtn { border: 1px solid var(--line-strong); background: var(--card); border-radius: 8px; padding: 5px 9px; font-family: var(--mono); font-size: 12px; }
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr) 320px; gap: 14px; margin-top: 14px; align-items: start; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
/* sidebar */
.side { padding: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); }
.side h3 { font-family: var(--mono); font-size: 12px; margin: 2px 4px 10px; display: flex; justify-content: space-between; color: var(--muted); }
.les { margin-bottom: 4px; }
.les > button { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 7px 6px; border-radius: 8px; text-align: left; font-family: var(--mono); font-weight: 600; font-size: 13px; }
.les > button:hover { background: var(--card2); }
.les .sq { width: 14px; height: 12px; border-radius: 3px; border: 1px solid var(--edge); flex: none; }
.les .cnt { margin-left: auto; color: var(--muted); font-size: 11px; font-weight: 400; }
.steps { list-style: none; margin: 2px 0 6px 18px; padding: 0 0 0 10px; border-left: 1px dashed var(--line-strong); }
.steps button { width: 100%; text-align: left; border: 0; background: none; padding: 4px 8px; border-radius: 6px; font-size: 12.5px; color: var(--ink2); display: flex; gap: 6px; }
.steps button[aria-current="step"] { background: var(--green); border: 1px solid var(--edge); color: var(--green-ink); font-weight: 700; }
.steps .ck { color: var(--muted); width: 12px; flex: none; }
.prog { margin-top: 10px; padding: 8px 6px 2px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; }
.refbtn { width: 100%; margin-top: 8px; border: 1px solid var(--line-strong); background: var(--card2); border-radius: 8px; padding: 6px; font-size: 12.5px; font-family: var(--mono); }
/* main */
.crumb { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.hd { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
h1 { font-size: clamp(20px, 2.3vw, 27px); margin: 4px 0 4px; text-wrap: balance; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.chips { display: flex; gap: 6px; padding-top: 8px; }
.chip.t-구조 { background: var(--mint); } .chip.t-문제 { background: var(--pink); } .chip.t-계산 { background: var(--orange); } .chip.t-비교 { background: var(--blue); } .chip.t-개요 { background: var(--violet); } .chip.t-정리 { background: var(--green); }
.canvas { padding: 12px; }
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.metric { background: var(--paper); border: 1px solid var(--line-strong); border-radius: 10px; padding: 7px 10px; min-width: 0; }
.metric .l { font-family: var(--mono); font-size: 10.5px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metric .v { font-family: var(--mono); font-weight: 800; font-size: 15px; margin-top: 3px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.metric .v.warn { color: var(--rust); }
.tools { display: flex; gap: 6px; justify-content: flex-end; margin: 8px 0 6px; }
.stage-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--line); }
.stage { display: block; width: 100%; min-width: 760px; height: auto; background-color: var(--sheet);
  background-image: repeating-linear-gradient(30deg, transparent 0 33px, var(--sheet-grid) 33px 34px), repeating-linear-gradient(150deg, transparent 0 33px, var(--sheet-grid) 33px 34px); }
.stage .ft { width: 100%; height: 100%; display: flex; flex-direction: column; font-family: var(--sans); overflow: visible; color: var(--sheet-ink); }
.stage .ft.nw { white-space: nowrap; align-items: center; }
.stage .el { animation: rise .42s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 4ms); }
.stage .el.flow { animation: rise .42s both, dash 1.1s linear infinite; animation-delay: calc(var(--i) * 4ms), 0s; }
.paused .stage .el.flow { animation-play-state: running, paused; }
@keyframes rise { from { opacity: .15; transform: translateY(3px); } to { opacity: 1; transform: none; } }
@keyframes dash { to { stroke-dashoffset: -22; } }
@media (prefers-reduced-motion: reduce) { .stage .el, .stage .el.flow { animation: none !important; } }
.mtable { width: 100%; height: 100%; border-collapse: collapse; font-family: var(--sans); font-size: 11.2px; color: #34302b; table-layout: fixed; }
.mtable th, .mtable td { border: 1px solid #c6bbac; padding: 5px 7px; vertical-align: middle; background: #fffdf8; line-height: 1.35; }
.mtable th { font-size: 12.5px; color: #1d1b18; } .mtable td.w { color: #b8321f; background: #fbedea; }
.tl { margin-top: 12px; padding: 10px 14px 8px; }
.tl .row { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.tl ol { list-style: none; display: flex; padding: 0; margin: 8px 0 0; position: relative; }
.tl ol::before { content: ""; position: absolute; left: 7%; right: 7%; top: 13px; border-top: 1px solid var(--line-strong); }
.tl li { flex: 1; text-align: center; position: relative; min-width: 0; }
.tl li button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; font-size: 11.5px; color: var(--muted); }
.tl .dot { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--paper); display: grid; place-items: center; font-family: var(--mono); font-weight: 800; font-size: 12px; }
.tl li.done .dot { border-color: var(--edge); background: var(--card2); color: var(--ink); }
.tl li.cur .dot { border: 2px solid var(--edge); background: var(--green); color: var(--green-ink); }
.tl li.cur button { color: var(--ink); font-weight: 700; }
/* panel */
.panel { padding: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px); }
.ph { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--muted); font-weight: 600; }
.panel h2 { font-size: 18px; margin: 10px 0 8px; line-height: 1.35; text-wrap: balance; }
.panel p { font-size: 13.2px; line-height: 1.62; color: var(--ink2); margin: 0 0 10px; }
.key { background: var(--violet); border: 1px solid var(--violet-line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 26px 1fr; gap: 8px; margin: 4px 0 12px; }
.key .ic { width: 26px; height: 26px; border: 1px solid var(--edge); border-radius: 7px; display: grid; place-items: center; background: var(--paper); font-size: 13px; }
.key .k { font-family: var(--mono); font-size: 10.5px; color: var(--muted); font-weight: 700; }
.key div p { margin: 2px 0 0; font-size: 12.8px; }
.chg h4 { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin: 0 0 6px; }
.chg ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.chg li { display: grid; grid-template-columns: 18px 1fr; gap: 6px; font-size: 12.8px; color: var(--ink2); line-height: 1.45; }
.chg .sg { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; margin-top: 1px; }
.sg.p { background: #6fae5f; } .sg.m { background: #c8552a; } .sg.e { background: #9a9187; } .sg.q { background: #8e7cc3; }
.nav { display: grid; grid-template-columns: auto 1fr; gap: 8px; margin-top: 14px; }
.nav button { border: 1px solid var(--edge); border-radius: 10px; padding: 9px 12px; font-family: var(--mono); font-weight: 700; font-size: 12.5px; background: var(--card2); }
.nav .nx { background: var(--green); color: var(--green-ink); box-shadow: var(--shadow); text-align: center; }
.nav button:disabled { opacity: .45; cursor: default; }
.hint { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 8px; text-align: center; }
kbd { border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; font-family: var(--mono); font-size: 10px; background: var(--paper); }
.learn { margin-top: 12px; padding: 12px 14px; }
.learn h4 { margin: 0 0 8px; font-family: var(--mono); font-size: 12px; }
.learn ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 12.5px; color: var(--ink2); }
.learn li { display: flex; gap: 8px; } .learn .bx { width: 14px; height: 14px; border: 1px solid var(--line-strong); border-radius: 3px; flex: none; margin-top: 2px; display: grid; place-items: center; font-size: 10px; }
.learn li.v .bx { background: var(--green); border-color: var(--edge); }
.refs { padding: 18px 20px; }
.refs ol { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 7px; font-size: 13px; color: var(--ink2); }
.refs li { display: grid; grid-template-columns: 38px 1fr; gap: 4px; overflow-wrap: anywhere; }
.refs li b { font-family: var(--mono); color: var(--muted); }
.cite { font-family: var(--mono); font-size: .86em; color: var(--muted); }
@media (max-width: 1180px) { .app { grid-template-columns: 210px minmax(0, 1fr); } .panel { grid-column: 2; position: static; } }
@media (max-width: 820px) { .app { grid-template-columns: minmax(0, 1fr); } .side, .panel { position: static; grid-column: auto; } .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } .side .steps { display: none; } .side .les.open .steps { display: block; } .tl li button span:last-child { display: none; } }
/* 상황도 안의 표 — SVG user unit 기준이므로 지문 글자 크기에 맞춰 확대 */
.mtable{font-size:17px;line-height:1.32}
.mtable th,.mtable td{padding:7px 9px}
.mtable th{font-size:17px}
/* ── 뷰포트 고정 3단: 좌측 tree · 지문+상황도 · 문제 (페이지 스크롤 없음) ── */
html{height:100%}
body{height:100vh;overflow:hidden;margin:0;padding-block:0;display:flex;flex-direction:column}
.top{flex:0 0 auto;padding:8px 0;min-height:0}
.app{flex:1 1 auto;min-height:0;margin:9px 0 0;gap:12px;align-items:stretch;
  grid-template-columns:376px minmax(0,5fr) minmax(0,3fr)}
body.nav-off .app{grid-template-columns:0 minmax(0,5fr) minmax(0,3fr)}
body.nav-off .side{display:none}
.side{height:100%;overflow:auto;position:static}
#main{height:100%;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
#panelCol{height:100%;min-height:0;overflow:auto;position:static}
.stemcard{flex:0 0 auto;min-height:0;overflow:visible}
#figRow .stage-wrap{align-items:center;justify-content:center}
#figRow{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:8px 11px;overflow:hidden}
#figRow .stage-wrap{flex:1 1 auto;min-height:0;display:flex;border:0}
#figRow svg.stage{width:100%;height:100%;min-width:0;border-radius:10px;border:1px solid var(--line)}
h1{font-size:clamp(16px,1.35vw,20px);margin:1px 0;line-height:1.25}
.hd{gap:8px;margin-bottom:2px}
.crumb{font-size:11px}
#main>.sub{display:none}
html{height:100%;overflow:hidden}
html.sc{height:auto;overflow:auto}
body.scrollable{height:auto;overflow:auto;display:block}
body.scrollable .app{height:auto;max-height:none}
body.scrollable .side{height:auto;max-height:none;overflow:visible;position:sticky;top:10px;align-self:start}
body.scrollable #main,body.scrollable #panelCol{height:auto;overflow:visible}
@media (max-width:1430px){.app{grid-template-columns:300px minmax(0,5fr) minmax(0,3fr)}}
@media (max-width:1180px){body{overflow:auto;height:auto;display:block}.app{grid-template-columns:260px minmax(0,1fr);height:auto;max-height:none}
  #main,#panelCol,.side{height:auto}#figRow{min-height:320px}}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}
/* ── 좌측 tree (2배) ── */
.side{padding:14px 12px}
.side h3{font-size:13px;margin:2px 4px 12px}
.side .les>button{font-size:15px;padding:9px 8px;gap:10px}
.side .les .sq{width:18px;height:15px}
.side .les .cnt{font-size:13px}
.side .steps{margin:4px 0 10px 22px;padding-left:12px}
.side .steps button{font-size:13.4px;line-height:1.45;padding:6px 9px;gap:8px}
.side .steps .ck{width:15px;font-size:13px}
.side .prog{font-size:13px;padding-top:10px}
.refbtn{font-size:13.5px;padding:9px}

/* ── 문제 영역 (키움) ── */
.lvchip{font-family:var(--mono);font-size:11px;font-weight:700;border-radius:5px;padding:2px 7px;border:1px solid var(--edge)}
.lv-B{background:var(--mint)} .lv-I{background:var(--blue)} .lv-A{background:var(--pink)}
.panel{padding:16px 18px}
.panel h2{font-size:19px;margin:10px 0 10px;line-height:1.4}
.stem{font-size:14.6px;line-height:1.68;color:var(--ink2);margin:0 0 9px;word-break:keep-all}
.qhdr{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.02em;margin:10px 0 6px}
.opts{display:grid;gap:9px;margin:2px 0}
.opt{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;text-align:left;
  border:1px solid var(--line-strong);background:var(--card2);border-radius:11px;padding:10px 13px;
  font-size:14.2px;line-height:1.55;word-break:keep-all}
.opt:hover{background:var(--paper)}
.opt .n{font-family:var(--mono);font-weight:800;font-size:13.5px;border:1px solid var(--edge);border-radius:50%;
  width:25px;height:25px;display:grid;place-items:center;background:var(--paper);flex:none}
.opt.sel{border:2px solid var(--edge);background:var(--violet);padding:11px 13px}
.opt.ok{border:2px solid #2f5a1e;background:var(--green);padding:11px 13px}
.opt.no{border:2px solid var(--rust);background:var(--pink);padding:11px 13px}
.opt.ok .n{background:#2f5a1e;color:#fff;border-color:#2f5a1e}
.opt.no .n{background:var(--rust);color:#fff;border-color:var(--rust)}
.exp{background:var(--violet);border:1px solid var(--violet-line);border-radius:11px;padding:12px 14px;margin-top:14px}
.exp .k{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:700}
.exp p{margin:4px 0 0;font-size:14.2px;line-height:1.75}
.verdict{font-family:var(--mono);font-size:13px;font-weight:800;border-radius:8px;padding:4px 11px;border:1px solid var(--edge)}
.v-ok{background:var(--green);color:var(--green-ink)} .v-no{background:var(--pink);color:#8c2b1c}
.panel .ph{font-size:13px}
.nav button{font-size:13.5px;padding:11px 14px}

/* ── 중앙(지문·그림) ── */
.metric .l{font-size:11px}
.metric .v{font-size:15px;margin-top:1px}
.metric{padding:5px 8px}
.metrics{gap:6px}
.stemcard{padding:12px 15px;margin-bottom:0}
.stemcard .qhdr{margin:0 0 8px}

.side .les .cnt.done{color:var(--green-ink);font-weight:700}
.steps .ck.a{color:var(--rust);font-weight:800}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:10px 0 0}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--card);padding:7px 13px;font-family:var(--mono);font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--green-ink)}
.gradebar{display:flex;gap:8px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.gradebar .big{flex:1;border:1px solid var(--edge);border-radius:11px;padding:11px;font-family:var(--mono);font-weight:800;
  font-size:13.5px;background:var(--orange);box-shadow:var(--shadow);text-align:center}
.gradebar .big:disabled{opacity:.45;box-shadow:none;cursor:default;background:var(--card2)}

/* ── 시작 화면 ── */
.startwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;max-width:1020px;margin:0 auto;width:100%;
  grid-column:1 / -1;overflow:auto;max-height:100%}
.setup{padding:22px 24px}
.setup h2{font-size:17px;margin:0 0 4px}
.setup .lead{color:var(--muted);font-size:13.5px;margin:0 0 18px;line-height:1.7}
.fld{margin:0 0 20px}
.fld>label{display:block;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);margin:0 0 8px}
.fld .note{font-size:12.5px;color:var(--muted);margin:7px 0 0;line-height:1.6}
.domgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.domgrid button{display:grid;grid-template-columns:20px 1fr auto;gap:9px;align-items:center;text-align:left;
  border:1px solid var(--line-strong);background:var(--card2);border-radius:10px;padding:10px 12px;font-size:13.6px}
.domgrid button[aria-pressed="true"]{border:2px solid var(--edge);background:var(--green);padding:9px 11px}
.domgrid .bx{width:18px;height:18px;border:1px solid var(--edge);border-radius:4px;background:var(--paper);
  display:grid;place-items:center;font-size:12px;font-weight:800}
.domgrid .c{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.startbar{display:flex;gap:10px;align-items:center;margin-top:6px}
.startbtn{flex:1;border:1px solid var(--edge);border-radius:12px;padding:15px;font-family:var(--mono);font-weight:800;
  font-size:15px;background:var(--green);color:var(--green-ink);box-shadow:var(--shadow);text-align:center}
.startbtn:disabled{opacity:.45;box-shadow:none;cursor:default;background:var(--card2);color:var(--muted)}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 18px}
.summary .b{border:1px solid var(--edge);border-radius:11px;padding:9px 14px;background:var(--paper);min-width:96px}
.summary .b .l{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:700}
.summary .b .v{font-family:var(--mono);font-size:19px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}

.res{padding:20px 22px}
.res h2{margin:0 0 4px;font-size:21px}
.score{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.score .b{border:1px solid var(--edge);border-radius:12px;padding:10px 14px;background:var(--card2);min-width:112px}
.score .b .l{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:700}
.score .b .v{font-family:var(--mono);font-size:22px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.res h4{font-family:var(--mono);font-size:12.5px;margin:18px 0 6px;color:var(--muted)}
.res .wrongs{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.res .wrongs li{display:grid;grid-template-columns:38px 1fr auto;gap:9px;font-size:13.4px;align-items:center;
  border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--card2)}
.res .wrongs b{font-family:var(--mono);color:var(--rust);font-size:11.5px}
.res .wrongs button{border:1px solid var(--line-strong);background:var(--paper);border-radius:7px;padding:4px 9px;font-size:12px;font-family:var(--mono)}
svg.chart{display:block;width:100%;max-width:940px;height:auto;background:var(--sheet);border:1px solid var(--line);border-radius:10px}
/* 막대 차트 — 항목 수와 무관하게 막대 두께·글자 크기 고정 */
.bars{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:10px;
  padding:14px 18px 8px 18px;max-width:940px}
.brow{display:grid;grid-template-columns:168px minmax(0,1fr) 108px;align-items:center;gap:12px;height:30px;position:relative;z-index:1}
.blab{font-size:13.4px;text-align:right;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btrack{height:20px;border:1px solid var(--line-strong);border-radius:4px;background:var(--card);overflow:hidden}
.bfill{height:100%;border-right:1px solid var(--edge)}
.bval{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.bval span{font-weight:400;color:var(--muted)}
.bgrid{position:absolute;left:calc(168px + 12px + 18px);right:calc(108px + 12px + 18px);top:14px;bottom:36px;z-index:0}
.bgrid span{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line-strong)}
.baxis{position:relative;height:18px;margin-left:180px;margin-right:120px}
.baxis span{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--muted);top:2px}
.btitle{text-align:center;font-size:12px;font-weight:700;color:var(--ink2);margin:2px 0 6px;
  margin-left:180px;margin-right:120px}
.hint2{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:10px}
.histtab{width:100%;border-collapse:collapse;font-size:13.4px;margin-top:4px}

:root{--yellow:#f7dc8c} :root[data-theme="dark"]{--yellow:#6a5a28} @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--yellow:#6a5a28}}

const clampX = (x, w2) => Math.max(DG.x + (w2 || 0.5), Math.min(DG.x + DG.w - (w2 || 0.5), x));
function curve(s, pts, c, lw, o = {}) { for (let i = 1; i < pts.length; i++) L(s, pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1], c, lw || 1.3, o); }
function hatch(s, x, y, w, h, c, step) {

}
function legend(s, x, y, items, o = {}) {

// 표: 행 수에 맞춰 높이를 자동 계산
function table(s, rows, x, y, w, hit) {

    { x, y, w, h: 0.32 + rows.length * 0.60 });

function tableCol(s, rows, x, y, w, hitCol) {

    { x, y, w, h: 0.32 + rows.length * 0.60 });

function flagOf(s, p) { /* 조건 표시는 카드 머리말(HTML)에서 처리 */ }
// 좌측 열 주석 띠: 그림 아래에 왼쪽 정렬 pill 을 쌓는다 (화면 밖 잘림 방지)
const ANY = TOP + 3.58;                                   // 주석 띠 시작 y

// ========== T1. TSV 단면 ==========
function f_tsv(s, p) {
  const cx = LC.x + 1.5, top = TOP + 0.78, dep = 2.55, wt = 0.6, wb = wt * (p.taper == null ? 0.82 : p.taper);
  R(s, LC.x, top - 0.26, 3.0, 0.26, MX.lowk, { lw: 0.8, text: "BEOL / low-k ILD", fs: 8 });
  R(s, LC.x, top, 3.0, dep + 0.52, MX.si, { lw: 0.9 });
  T(s, "Si (core die)", LC.x + 1.95, top + 1.9, 1.15, 0.2, { fs: 8, bold: true, color: K.ink2 });
  const n = 22, amp = (p.scallop || 0) * 0.018;
  const half = (i) => wt / 2 + (wb / 2 - wt / 2) * (i / n);
  const off = (k) => { const a = [], b = [];
    for (let i = 0; i <= n; i++) { const yy = top + dep * i / n, hw = half(i) - k, bb = amp * Math.abs(Math.sin(i * Math.PI / 2)); a.push([cx - hw - bb, yy]); b.push([cx + hw + bb, yy]); }
    return a.concat(b.slice().reverse()); };
  poly(s, off(0), MX.bare, { lw: 0.9 });
  poly(s, off(0.03), MX.ox, { lw: 0.5 });
  poly(s, off(0.055), p.barrier === false ? MX.ox : MX.ti, { lw: 0.5 });
  const fill = p.fill || "good", inner = off(0.075);
  poly(s, inner, MX.cu, { lw: 0.5 });
  if (fill === "void") { E(s, cx - 0.11, top + dep * 0.44, 0.22, 0.5, MX.bare, { lw: 0.9 }); annotTo(s, cx + 0.1, top + dep * 0.5, 0, "void — 충전이 중앙에서 닫혀 빈 공간이 남았다", K.pink); }
  else if (fill === "seam") { L(s, cx, top + 0.2, cx, top + dep - 0.1, K.edge, 0.9, { dash: 1 }); annotTo(s, cx, top + 1.1, 0, "seam — 양 측벽 성장면이 중심에서 만났다", K.pink); }
  else if (fill === "pinch") { poly(s, [[cx - 0.1, top + 0.1], [cx + 0.1, top + 0.1], [cx + 0.03, top + 0.95], [cx - 0.03, top + 0.95]], MX.bare, { lw: 0.8 }); annotTo(s, cx, top + 0.55, 0, "pinch-off — 입구가 먼저 닫혔다", K.pink); }
  if (p.overburden !== false) R(s, cx - wt / 2 - 0.1, top - 0.26 - 0.14, wt + 0.2, 0.14, MX.cu, { lw: 0.8 });
  dimH(s, cx - wt / 2, cx + wt / 2, top - 0.5, "Ø " + (p.dia_um || 5) + " µm");
  dimV(s, LC.x + 3.12, top, top + dep, (p.depth_um || 60) + " µm");
  annot(s, 1, "aspect ratio = 깊이 / 직경 = " + (p.ar || 12) + " : 1", K.orange);
  // 우측: 측벽 확대 + 범례
  ttl(s, "측벽 확대 (Bosch 주기)", RC.x, TOP, 2.6);
  const ix = RC.x + 0.1, iy = TOP + 0.26;
  R(s, ix, iy, 1.05, 1.6, MX.si, { lw: 0.8 });
  const pts = [];
  for (let i = 0; i <= 30; i++) { const yy = iy + 1.6 * i / 30; pts.push([ix + 0.95 - (p.scallop ? 0.08 : 0.0) * Math.abs(Math.sin(i * Math.PI / 3)), yy]); }
  curve(s, pts, K.edge, 1.1);
  poly(s, pts.concat([[ix + 1.05, iy + 1.6], [ix + 1.05, iy]]), MX.bare, { line: null, tr: 12 });
  dimV(s, ix + 0.22, iy + 0.55, iy + 1.05, (p.scallopPitch || 0.35) + " µm");
  pill(s, RC.x + 1.35, iy + 0.5, "scallop "  + (p.scallopDepth || 60) + " nm", { fs: 8, fill: p.scallop ? K.orange : K.mint, align: "left", maxW: 2.4 });
  pill(s, RC.x + 1.35, iy + 0.95, p.scallop ? "측벽 거칠기 → liner 피복 불균일" : "매끈한 측벽", { fs: 8, fill: K.violet, align: "left", maxW: 2.4 });
  ttl(s, "막 구성", RC.x, iy + 1.95, 2.4);
  legend(s, RC.x, iy + 2.24, [[MX.ox, "liner SiO2"], [p.barrier === false ? MX.bare : MX.ti, p.barrier === false ? "barrier 없음 (Cu 확산 위험)" : "barrier Ta / TaN"], [MX.cu, "Cu (electroplated)"], [MX.bare, "void / 미충전"]], { cols: 1, cw: 3.6 });
  flagOf(s, p); cap(s, p.note || "두께 방향 확대 표시 · 평면 치수 비례 아님");
}

// ========== T2. CMP dishing / erosion ==========
function f_cmp(s, p) {
  const x0 = LC.x + 0.15, y0 = TOP + 0.42;
  ttl(s, "상면: pattern density 가 다른 두 영역", LC.x, TOP - 0.02, 4.3);
  R(s, x0, y0, 1.5, 1.3, MX.si, { lw: 0.9 });
  R(s, x0 + 1.5, y0, 1.5, 1.3, MX.si, { lw: 0.9 });
  const put = (ox, nx, r) => { for (let i = 0; i < nx; i++) for (let j = 0; j < nx; j++) E(s, ox + 0.14 + i * (1.22 / nx), y0 + 0.11 + j * (1.06 / nx), r, r, MX.cu, { lw: 0.5 }); };
  put(x0, p.nA || 4, 0.18); put(x0 + 1.5, p.nB || 8, 0.09);
  pill(s, x0 + 0.1, y0 + 1.62, "A · " + (p.densA || 15) + "%", { fs: 8, fill: K.blue, align: "left" });
  pill(s, x0 + 1.6, y0 + 1.62, "B · " + (p.densB || 55) + "%", { fs: 8, fill: K.orange, align: "left" });
  const cy = y0 + 2.3, hh = 0.5;
  ttl(s, "CMP 후 단면 표면 높이", LC.x, cy - 0.26, 3.6);
  R(s, x0, cy, 3.0, hh, MX.si, { lw: 0.9 });
  const prof = [];
  for (let i = 0; i <= 64; i++) {
    const t = i / 64, xx = x0 + 3.0 * t;
    let d = (t > 0.5 ? (p.erosion_nm || 40) / 420 : 0) + ((p.dish_nm || 90) / 420) * Math.pow(Math.abs(Math.sin(t * Math.PI * (t > 0.5 ? 16 : 8))), 2);
    prof.push([xx, cy + d * 0.55]);
  }
  curve(s, prof, K.rust, 1.6);
  L(s, x0, cy, x0 + 3.0, cy, K.edge, 0.7, { dash: 1 });
  annotTo(s, x0 + 0.9, cy + 0.12, 0, "dishing " + (p.dish_nm || 90) + " nm — 넓은 Cu 가 국부로 파인다", K.pink);
  annotTo(s, x0 + 2.5, cy + 0.2, 1, "erosion " + (p.erosion_nm || 40) + " nm — 고밀도 영역이 함께 내려간다", K.pink);
  const g = axes(s, RC.x + 0.72, TOP + 0.75, 2.8, 2.9, {
    xmin: 0, xmax: 60, xticks: [0, 15, 30, 45, 60], ymin: 0, ymax: 160, yticks: [0, 40, 80, 120, 160],
    xlab: "pattern density (%)", ylab: "표면 단차 (nm)",
  });
  const dd = [[5, 25], [15, 55], [30, 95], [45, 125], [60, 150]], ee = [[5, 10], [15, 22], [30, 38], [45, 52], [60, 62]];
  curve(s, dd.map(([a, b]) => [g.X(a), g.Y(b)]), K.rust, 1.6); dd.forEach(([a, b]) => E(s, g.X(a) - 0.05, g.Y(b) - 0.05, 0.1, 0.1, K.rust, { line: null }));
  curve(s, ee.map(([a, b]) => [g.X(a), g.Y(b)]), "4D6B35", 1.6, { dash: 1 }); ee.forEach(([a, b]) => E(s, g.X(a) - 0.05, g.Y(b) - 0.05, 0.1, 0.1, "4D6B35", { line: null }));
  legend(s, RC.x + 0.72, TOP + 4.1, [[K.rust, "dishing (배선 폭 의존)"], ["4D6B35", "erosion (영역 전체)"]], { cols: 1, cw: 3.0 });
  flagOf(s, p); cap(s, p.note || "두께 방향 확대 표시 · 그래프는 설명용 경향선");
}

// ========== T3. Backside pad 공정 단면 ==========
// p:{step 0..7, defect:'undercut'|'residue'|'none', ox1,sin,ox2,ni_um}
function f_bs(s, p) {
  const step = p.step == null ? 7 : p.step;
  const x0 = LC.x + 0.1, w = 2.35, sy = TOP + 2.45;            // Si 상면
  R(s, x0, sy, w, 0.95, MX.si, { lw: 0.9, text: "Si", fs: 8 });
  const tsv = [x0 + 0.55, x0 + 1.17, x0 + 1.79], tw2 = 0.22, prot = step >= 1 ? 0 : 0.14;
  tsv.forEach((tx) => { R(s, tx - tw2 / 2 - 0.03, sy, tw2 + 0.06, 0.95, MX.ox, { lw: 0.4 }); R(s, tx - tw2 / 2, sy - prot, tw2, 0.95 + prot, MX.cu, { lw: 0.6 }); });
  // 절연막 적층
  let y = sy; const names = [];
  const lay = (th, c, nm2) => { R(s, x0, y - th, w, th, c, { lw: 0.65 }); y -= th; names.push([nm2, y + th / 2, c]); };
  if (step >= 1) lay(0.13, MX.ox, "SiO2 " + (p.ox1 || 300) + "nm");
  if (step >= 2) lay(0.11, MX.sin, "SiN " + (p.sin || 200) + "nm");
  if (step === 3) lay(0.20, MX.ox2, "희생 SiO2 " + (p.ox2 || 500) + "nm");
  if (step === 3) annot(s, 1, "이 희생 SiO2 는 다음 CMP 에서 전량 제거된다", K.violet);
  // pad 개구 + seed + Ni
  if (step >= 5) tsv.forEach((tx) => R(s, tx - 0.17, y, 0.34, sy - y, MX.bare, { lw: 0.6 }));
  if (step >= 5) tsv.forEach((tx) => {
    poly(s, [[tx - 0.26, y], [tx + 0.26, y], [tx + 0.26, y - 0.04], [tx + 0.21, y - 0.04], [tx + 0.21, sy - 0.04], [tx - 0.21, sy - 0.04], [tx - 0.21, y - 0.04], [tx - 0.26, y - 0.04]], MX.ti, { lw: 0.55 });
    poly(s, [[tx - 0.26, y - 0.04], [tx + 0.26, y - 0.04], [tx + 0.26, y - 0.075], [tx + 0.185, y - 0.075], [tx + 0.185, sy - 0.075], [tx - 0.185, sy - 0.075], [tx - 0.185, y - 0.075], [tx - 0.26, y - 0.075]], MX.cu, { lw: 0.55 });
  });
  if (step === 5) { R(s, x0, y - 0.04, w, 0.04, MX.ti, { lw: 0.35, tr: 30 }); R(s, x0, y - 0.075, w, 0.035, MX.cu, { lw: 0.35, tr: 30 }); }
  if (step >= 6) { tsv.forEach((tx) => R(s, tx - 0.26, y - 0.29, 0.52, 0.215, MX.ni, { lw: 0.75 })); if (step === 6) { R(s, x0, y - 0.04, w, 0.04, MX.ti, { lw: 0.35, tr: 30 }); R(s, x0, y - 0.075, w, 0.035, MX.cu, { lw: 0.35, tr: 30 }); } }
  if (step >= 7 && p.defect === "undercut") {
    tsv.forEach((tx) => { R(s, tx - 0.26, y - 0.075, 0.07, 0.075, MX.bare, { lw: 0.5 }); R(s, tx + 0.19, y - 0.075, 0.07, 0.075, MX.bare, { lw: 0.5 }); });
    annotTo(s, tsv[1] + 0.23, y - 0.04, 1, "seed undercut — Ni pad 가장자리 들뜸", K.pink);
  }
  if (step >= 7 && p.defect === "residue") {
    R(s, x0 + 0.2, y - 0.03, w - 0.4, 0.03, MX.cu, { lw: 0.35, tr: 15 });
    annotTo(s, tsv[1] - 0.45, y - 0.015, 1, "seed residue: pad 사이에 Cu 가 남아 leakage 경로가 된다", K.pink);
  }
  // 좌측 라벨
  names.forEach(([t, yy, c], i) => lead(s, x0 + w - 0.15, yy, x0 + w + 0.18, TOP + 0.3 + i * 0.50, t, { fill: c }));
  if (step >= 5) lead(s, tsv[2] + 0.23, y - 0.05, x0 + w + 0.18, TOP + 0.3 + names.length * 0.50, "Ti / Cu seed", { fill: MX.ti });
  if (step >= 6) lead(s, tsv[2] + 0.24, y - 0.2, x0 + w + 0.18, TOP + 0.3 + (names.length + 1) * 0.50, "Ni plating " + (p.ni_um || 2) + " µm", { fill: MX.ni });
  annotTo(s, tsv[0], sy + 0.75, 0, "TSV Cu — reveal 로 뒷면에 드러난 상태", MX.cu);
  if (step === 4) annot(s, 1, "CMP: SiN stop 으로 희생 SiO2 전량 제거", K.mint);
  // 우측: 공정 순서
  const names2 = ["TSV reveal", "SiO2 증착", "SiN 증착", "SiO2 희생막", "CMP (SiN stop)", "Ti / Cu seed", "Ni plating", "seed etching"];
  ttl(s, "공정 순서", RC.x, TOP - 0.02, 2.0);
  names2.forEach((t, i) => {
    const cur = i === step, yy = TOP + 0.34 + i * 0.44;
    R(s, RC.x, yy, 3.6, 0.36, cur ? K.green : (i < step ? K.card2 : K.sheet), { lw: cur ? 1.3 : 0.7, round: 0.5, text: (i + 1) + ". " + t, fs: 8, bold: cur, align: "left", color: i < step ? K.muted : K.ink });
  });
  annot(s, 2, "최종 절연막 = SiO2 / SiN 2층", K.mint);
  flagOf(s, p); cap(s, p.note || "두께 방향 확대 표시 · 평면 치수 비례 아님");
}

// ========== T4. Bump / UBM / IMC ==========
function f_bump(s, p) {
  const cx = LC.x + 1.5, y = TOP + 0.55, pw = 0.95;
  R(s, LC.x + 0.2, y, 2.6, 0.28, MX.si, { lw: 0.9, text: "upper die", fs: 8 });
  let yy = y + 0.28;
  R(s, cx - pw / 2 - 0.1, yy, pw + 0.2, 0.09, MX.lowk, { lw: 0.6 }); yy += 0.09;
  R(s, cx - pw / 2, yy, pw, 0.11, MX.cu, { lw: 0.7 }); yy += 0.11;
  if (p.niBarrier) { R(s, cx - pw / 2, yy, pw, 0.08, MX.ni, { lw: 0.7 }); yy += 0.08; }
  const imc1 = yy, it = Math.max(0.05, (p.imc_um || 2) * 0.035);
  R(s, cx - pw / 2, yy, pw, it, MX.imc, { lw: 0.7 }); yy += it;
  const st = Math.max(0.14, (p.solder_um || 15) * 0.014), soly = yy;
  R(s, cx - pw / 2, yy, pw, st, MX.sol, { lw: 0.7 }); yy += st;
  R(s, cx - pw / 2, yy, pw, it, MX.imc, { lw: 0.7 }); yy += it;
  if (p.niBarrier) { R(s, cx - pw / 2, yy, pw, 0.08, MX.ni, { lw: 0.7 }); yy += 0.08; }
  const ph = Math.max(0.3, (p.pillar_um || 25) * 0.014), piy = yy;
  R(s, cx - pw / 2, yy, pw, ph, MX.cu, { lw: 0.8, text: "Cu pillar", fs: 8 }); yy += ph;
  R(s, LC.x + 0.2, yy, 2.6, 0.28, MX.si, { lw: 0.9, text: "lower die", fs: 8 });
  if (p.kirkendall) {
    for (let i = 0; i < 5; i++) E(s, cx - 0.36 + i * 0.17, piy - 0.035, 0.075, 0.055, MX.bare, { lw: 0.6 });
    annotTo(s, cx - 0.36, piy - 0.01, 1, "Kirkendall void — Cu 측 계면의 공극", K.pink);
  }
  if (p.em) {
    A(s, cx + pw / 2 + 0.42, yy - 0.12, cx + pw / 2 + 0.42, imc1 - 0.05, K.rust, 1.6);
    pill(s, LC.x + 0.15, TOP + 0.18, "통전 조건 j = " + (p.j_kA || 15) + " kA/cm²", { fs: 8, fill: K.orange, align: "left" });
    for (let i = 0; i < 4; i++) E(s, cx - pw / 2 + 0.03 + i * 0.055, soly + st * 0.15, 0.05, 0.05, K.rust, { line: null, tr: 25 });
    annotTo(s, cx - pw / 2 + 0.04, soly + st * 0.3, 2, "current crowding — 모서리 전류 집중", K.pink);
  }
  const cP = piy + ph / 2, cS = soly + st / 2, need = 0.44;
  const push = Math.max(0, need - Math.abs(cP - cS));
  dimV(s, LC.x + 2.95, piy, piy + ph, "pillar " + (p.pillar_um || 25) + " µm", { dy: push / 2 });
  dimV(s, LC.x + 2.95, soly, soly + st, "solder " + (p.solder_um || 15) + " µm", { dy: -push / 2 });
  annotTo(s, cx + pw / 2 - 0.06, imc1 + it / 2, 0, "IMC " + (p.imc_um || 2) + " µm (Cu6Sn5 / Cu3Sn) 계면", MX.imc);
  legend(s, LC.x + 0.1, TOP + 3.05, [[MX.cu, "Cu"], [MX.sol, "solder"], [MX.imc, "IMC"], [MX.ni, p.niBarrier ? "Ni 적용" : "Ni 없음"]], { cols: 4, cw: 1.08 });
  const g = axes(s, RC.x + 0.68, TOP + 0.95, 2.85, 2.3, {
    xmin: 0, xmax: 1000, xticks: [0, 250, 500, 750, 1000], ymin: 0, ymax: 8, yticks: [0, 2, 4, 6, 8],
    xlab: "유지 시간 (h) @ " + (p.temp || 150) + " °C", ylab: "IMC 두께 (µm) — 확산 성장",
  });
  const k = p.k == null ? 0.22 : p.k, pts = [];
  for (let t = 0; t <= 1000; t += 20) pts.push([g.X(t), g.Y(Math.min(8, k * Math.sqrt(t)))]);
  curve(s, pts, K.rust, 1.7);
  pill(s, g.X(620), g.Y(7.3), "x = k · t^0.5", { fs: 8, fill: K.cream });
  if (p.hours) L(s, g.X(p.hours), g.Y(0), g.X(p.hours), g.Y(8), K.edge, 1.0, { dash: 1 });
  pill(s, RC.x, TOP + 3.95, p.bullet || "IMC 가 두꺼울수록 계면 파괴 확률 증가", { fs: 8, fill: K.violet, align: "left", maxW: RC.w });
  flagOf(s, p); cap(s, p.note || "두께 방향 확대 표시 · 그래프는 확산 지배 가정의 경향선");
}

// ========== T5. Sawing / dicing 단면 ==========

// ========== T9. 열 경로 / 층별 ΔT ==========
function f_therm(s, p) {
  const n = p.n || 12, q = p.q_Wmm2 == null ? 0.2 : p.q_Wmm2;
  const layers = p.layers || [["Si (die)", 30, 120], ["BEOL", 6, 3], ["bond layer", 9, 0.6]];
  const Rth = layers.reduce((a, l) => a + (l[1] * 1e-6) / l[2], 0), dT = q * 1e6 * Rth;
  const hotc = (f) => { const c = [[0.80, 0.86, 0.91], [0.99, 0.90, 0.72], [0.96, 0.66, 0.54], [0.84, 0.36, 0.26]];
    const t = Math.max(0, Math.min(0.999, f)) * 3, i = Math.floor(t), r = t - i, a = c[i], b = c[Math.min(3, i + 1)];
    return a.map((v, k2) => Math.round((v + (b[k2] - v) * r) * 255).toString(16).padStart(2, "0")).join("").toUpperCase(); };
  const avail = 4.1, dieH = Math.min(0.2, (avail - 0.3) / n * 0.7), gap = Math.min(0.1, (avail - 0.3) / n * 0.3);
  const x0 = LC.x + 0.25, top = TOP + 0.4, tt = [];
  ttl(s, "적층 방향 온도 — " + n + "단 (열은 위로 빠져나간다)", LC.x, TOP - 0.04, 4.3);
  const tMin = p.tTop || 95, tMax = tMin + dT * (n - 1);
  for (let i = 0; i < n; i++) {
    const Ti = tMin + dT * i; tt.push(Ti);
    const yy = top + i * (dieH + gap);
    R(s, x0, yy, 2.45, dieH, hotc((Ti - tMin) / Math.max(1e-6, tMax - tMin + 1e-6)), { lw: 0.7, text: (i === n - 1 ? "base die" : "core " + (n - 1 - i)) + "   " + Ti.toFixed(1) + " °C", fs: 8 });
    if (i < n - 1) R(s, x0, yy + dieH, 2.45, gap, MX.ncf, { lw: 0.35 });
  }
  R(s, x0 - 0.1, top - 0.26, 2.65, 0.24, MX.cold, { lw: 0.9, text: "TIM / lid (방열)", fs: 8 });
  A(s, x0 + 2.62, top + n * (dieH + gap) - 0.1, x0 + 2.62, top - 0.08, K.rust, 1.5);
  pill(s, x0 + 2.7, top + n * (dieH + gap) / 2, "열 흐름", { fs: 8, fill: K.orange, align: "left" });
  
  const rows = [["층", "두께 (µm)", "k (W/mK)", "R (m²K/W)"]]
    .concat(layers.map((l) => [l[0], String(l[1]), String(l[2]), ((l[1] * 1e-6) / l[2]).toExponential(2)]))
    .concat([["합계", "", "", Rth.toExponential(2)]]);
  table(s, rows, RC.x, TOP, RC.w, rows.length - 1);
  pill(s, RC.x, TOP + 0.32 + rows.length * 0.60 + 0.34, "q = " + q + " W/mm² → ΔT " + dT.toFixed(2) + " K", { fs: 8, fill: K.orange, align: "left", maxW: RC.w });
  pill(s, RC.x, TOP + 0.32 + rows.length * 0.60 + 0.81, "base die " + tt[n - 1].toFixed(1) + " °C · 상한 " + (p.limit || 85) + " °C", { fs: 8, fill: tt[n - 1] > (p.limit || 85) ? K.pink : K.mint, align: "left", maxW: RC.w });
  pill(s, RC.x, TOP + 0.32 + rows.length * 0.60 + 1.28, "간극 수는 die 수보다 하나 적다", { fs: 8, fill: K.violet, align: "left", maxW: RC.w });
  flagOf(s, p); cap(s, p.note || "1D 정상상태 · 측면 확산 무시 · 물성은 문항 제시값");
}

function INFLATE_RAW(src, outLen) {

  const LBASE = [3, 4, 5, 6, 7, 8, 9, 10, 11, 13, 15, 17, 19, 23, 27, 31, 35, 43, 51, 59,
                 67, 83, 99, 115, 131, 163, 195, 227, 258];

  const DBASE = [1, 2, 3, 4, 5, 7, 9, 13, 17, 25, 33, 49, 65, 97, 129, 193, 257, 385, 513, 769,
                 1025, 1537, 2049, 3073, 4097, 6145, 8193, 12289, 16385, 24577];
  const CLCIDX = [16, 17, 18, 0, 8, 7, 9, 6, 10, 5, 11, 4, 12, 3, 13, 2, 14, 1, 15];

  let sp = 0, buf = 0, cnt = 0;

  function bit() {
    if (!cnt) { buf = src[sp++]; cnt = 8; }

  }
  function bits(n) {
    if (!n) return 0;
    while (cnt < n) { buf |= src[sp++] << cnt; cnt += 8; }
    const v = buf & ((1 << n) - 1);
    buf >>>= n; cnt -= n; return v;

  function build(t, lens, off, num) {
    t.counts.fill(0);

    const offs = new Uint16Array(16);
    let sum = 0;
    for (let i = 1; i < 16; i++) { offs[i] = sum; sum += t.counts[i]; }
    for (let i = 0; i < num; i++) if (lens[off + i]) t.symbols[offs[lens[off + i]]++] = i;
  }
  function sym(t) {
    let sum = 0, cur = 0, len = 0;
    do { cur = 2 * cur + bit(); len++; sum += t.counts[len]; cur -= t.counts[len]; } while (cur >= 0);
    return t.symbols[sum + cur];

function UNPACK(b64, outLen) {

      g+=`<text x="${X(i)}" y="${Y(p.pct)-11}" font-size="11" fill="#34302b" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="700">${p.pct.toFixed(0)}</text>`; }); }
  return g+"</svg>";
}

/* ══════════ 시작(시험 구성) 화면 ══════════ */
function renderStart(){
  stopTimer(); document.body.classList.add("scrollable"); document.documentElement.classList.add("sc");
  const p = pool(), maxN = p.length;
  const byLv = ["B","I","A"].map(lv=>p.filter(o=>o.q.lv===lv).length);
  const counts = [10, 20, 30, 50].filter(n=>n<maxN);
  const n = cfg.count==="ALL" ? maxN : Math.min(+cfg.count, maxN);
  document.getElementById("app").innerHTML = `
  <div class="startwrap" style="grid-column:1 / -1">
    <section class="card setup">
      <div class="crumb">시험 구성</div>

      <p class="lead">출제 범위 ${ALLDOMS.length}개 영역 · 전체 ${BANK.length.toLocaleString()}문항. 선택한 조건으로 문항이 출제되며,
        <b>문항당 1.5분</b>이 주어지며, 제한 시간이 끝나면 그때까지의 답안으로 자동 채점됩니다 (미응답은 오답).
        답을 고른 뒤 <b>다음 문항</b>을 눌러야 넘어갑니다. 먼저 끝내면 마지막 문항에서 바로 채점할 수 있습니다.<br>
        그림은 두 종류입니다 — <b>상황도</b> ${BANK.filter(q=>q.figkind==="case").length.toLocaleString()}문항은 그 문항의 치수·결함·계산 조건이 그림에 그대로 반영되고,
        <b>주제 개념도</b> ${BANK.filter(q=>q.figkind!=="case"&&q.fig[0]!=="f_note").length.toLocaleString()}문항은 해당 공정을 이해하기 위한 참고 그림으로 문항의 수치를 담지 않습니다.
        구조 단면보다 판단 과정을 묻는 ${BANK.filter(q=>q.fig[0]==="f_note").length.toLocaleString()}문항에는 그림 대신 <b>핵심 개념 카드</b>가 제시됩니다.
        배경설명과 그림은 문항 본문에서 판정한 세부 주제 ${49}종을 따라 붙으며, 제시 조건의 '세부 주제' 항목에 그 이름이 표시됩니다.</p>

      <div class="summary">
        <div class="b"><div class="l">선택 가능</div><div class="v">${maxN.toLocaleString()}</div></div>
        <div class="b"><div class="l">출제 문항</div><div class="v">${n}</div></div>
        <div class="b"><div class="l">제한 시간</div><div class="v">${mmss(n * PER_Q_MS)}</div></div>
        <div class="b"><div class="l">영역</div><div class="v">${cfg.doms.length} / ${ALLDOMS.length}</div></div>
        <div class="b"><div class="l">미출제</div><div class="v">${p.filter(o=>seen.indexOf(o.i)<0).length.toLocaleString()}</div></div>

      </div>
      <p class="note" style="margin:-10px 0 18px">출제 이력을 기억해 아직 나오지 않은 문항을 먼저 뽑습니다.
        미출제가 모자라면 가장 오래전에 나온 문항부터 다시 사용합니다.
        <button class="iconbtn" type="button" id="clrSeen" style="margin-left:6px">출제 이력 비우기</button></p>

        <p class="note">선택한 난이도 안에서 — 초급 ${byLv[0]} · 중급 ${byLv[1]} · 고급 ${byLv[2]}문항이 현재 영역 선택에 포함되어 있습니다.</p>
      </div>

      <div class="fld"><label>문항 수</label>
        <div class="seg" id="segCnt">${counts.map(c=>`<button type="button" data-cnt="${c}" aria-pressed="${String(cfg.count)===String(c)}">${c}문항</button>`).join("")
          }<button type="button" data-cnt="ALL" aria-pressed="${cfg.count==="ALL"}">전체 ${maxN}문항</button></div>
      </div>

      <div class="fld"><label>출제 순서</label>

          <button class="iconbtn" type="button" id="domNone">전체 해제</button></p>
      </div>

      <div class="startbar">

        ${exam&&exam.length&&!graded?`<button class="iconbtn" type="button" id="resume">진행 중인 시험 이어하기 (${Object.keys(answers).length}/${exam.length})</button>`:""}
        ${history.length?`<button class="iconbtn" type="button" id="toRes">지난 결과 보기</button>`:""}

      <p class="hint2">시험을 시작하면 이전 답안은 지워집니다. 창을 새로 열거나 새로고침하면 항상 이 화면에서 다시 시작하며,

  const seg=(id,attr,fn)=>document.getElementById(id).querySelectorAll("["+attr+"]").forEach(b=>b.onclick=()=>{fn(b.getAttribute(attr)); wr("hbmq-cfg",cfg); renderStart();});
  seg("segLv","data-lv", v=>{cfg.lv=v;});
  seg("segCnt","data-cnt", v=>{cfg.count = v==="ALL"?"ALL":+v;});
  seg("segSh","data-sh", v=>{cfg.shuffle = v==="1";});
  document.getElementById("domGrid").querySelectorAll("[data-dom]").forEach(b=>b.onclick=()=>{
    const d=b.getAttribute("data-dom"), k=cfg.doms.indexOf(d);

  document.getElementById("domNone").onclick=()=>{cfg.doms=[]; wr("hbmq-cfg",cfg); renderStart();};
  const cs=document.getElementById("clrSeen"); if(cs) cs.onclick=()=>{ seen=[]; wr("hbmq-seen",[]); renderStart(); };
  document.getElementById("goStart").onclick=()=>{ if(!pool().length) return; buildExam(); location.hash="q"+exam[0]; render(); };
  const rb=document.getElementById("resume"); if(rb) rb.onclick=()=>{ location.hash="q"+exam[0]; render(); };
  const tr=document.getElementById("toRes"); if(tr) tr.onclick=()=>{ location.hash="result"; render(); };
  document.getElementById("topProg").textContent = `${maxN}문항 선택 가능`;
  document.getElementById("modeChip").textContent = "시험 구성";

/* ══════════ 좌측 tree ══════════ */
function sideHTML(curIdx){
  const doms = domains(), tot = active().length, done = active().filter(o=>answers[o.i]!=null).length;
  const lst = active(), gate = lst.findIndex(o=>answers[o.i]==null);
  const locked = (i)=> !graded && gate >= 0 && lst.findIndex(o=>o.i===i) > gate;
  let h = `<h3><span>출제 범위</span><span>${doms.length}개 영역 · ${tot}문항</span></h3>`;
  doms.forEach(([dom, list])=>{
    const n = list.filter(o=>answers[o.i]!=null).length, open = list.some(o=>o.i===curIdx);
    h += `<div class="les${open?" open":""}"><button type="button" data-go="q${list[0].i}"><span class="sq" style="background:${domColor(dom)}"></span>${esc(dom)}<span class="cnt${n===list.length?" done":""}">${n}/${list.length}</span></button>
      <ul class="steps">${list.map((o,k)=>{
        const a=answers[o.i], mark = graded ? (a===o.q.a?"✓":"✕") : (a!=null?"●":"·");
        const lk = locked(o.i);
        return `<li><button type="button" ${lk?'disabled style="opacity:.42;cursor:default"':`data-go="q${o.i}"`}${o.i===curIdx?' aria-current="step"':''}><span class="ck${a!=null?" a":""}">${lk?"·":mark}</span><span>${k+1}. ${esc(o.q.title)}</span></button></li>`;}).join("")}</ul></div>`;
  });
  h += `<button class="refbtn" type="button" data-go="result">결과 보기</button>
        <button class="refbtn" type="button" data-go="start">시험 구성 다시 하기</button>
        <div class="prog"><span>응답</span><span>${done} / ${tot}</span></div>`;
  document.getElementById("topProg").textContent = `${done} / ${tot} 문항`;
  document.getElementById("modeChip").textContent = graded ? "채점 완료" : "응시 중";
  document.getElementById("modeChip").style.background = graded ? "var(--orange)" : "var(--green)";
  return h;
}

/* ══════════ 문항 화면 ══════════ */
function render(){
  const h = location.hash.replace("#","");
  if (h === "result"){ renderResult(); return; }          // 진행 중인 시험이 없으면 응시 이력 화면으로 넘어간다
  if (h === "start" || !exam || !exam.length){ renderStart(); return; }
  const list = active();
  let k = list.findIndex(o => "q"+o.i === h); if (k < 0) k = 0;
  const cur = list[k], q = cur.q, idx = cur.i;
  const doms = domains(), di = doms.findIndex(d=>d[0]===q.dom), sib = doms[di][1], si = sib.findIndex(o=>o.i===idx);
  const a = answers[idx], prev = list[k-1], next = list[k+1];
  const remain = list.filter(o=>answers[o.i]==null).length;
  const answered = a != null;
  const gate = list.findIndex(o=>answers[o.i]==null);   // 첫 미응답 위치 (없으면 -1)

  document.getElementById("app").innerHTML = `
  <aside class="card side" id="side" aria-label="출제 범위">${sideHTML(idx)}</aside>
  <main id="main">
    <div class="crumb">${esc(q.dom)}  /  이 영역 ${sib.length}문항 중 ${si+1}번</div>
    <div class="hd"><h1>${esc(q.title)}</h1><div class="chips"><span class="lvchip lv-${q.lv}">${LVNAME[q.lv]}</span><span class="chip">${k+1} / ${list.length}</span></div></div>
    <section class="card stemcard">
      <p class="stem">${esc(stemOf(q))}</p>
      <div class="qhdr" style="margin:0 0 5px">제시 조건</div>
      <div class="metrics">${q.metrics.map(m=>`<div class="metric"><div class="l">${esc(m[0])}  ${esc(m[1])}</div><div class="v">${esc(m[2])}</div></div>`).join("")}</div>
    </section>
    <section class="card canvas" id="figRow">
      <div class="hd" style="align-items:center;gap:8px">
        <div class="qhdr" style="margin:0">${q.figkind==="case" ? "상황도 — 이 문항의 조건이 반영된 그림" : (q.fig[0]==="f_note" ? "핵심 개념 — 판단의 근거가 되는 사실" : "주제 개념도 — 문항의 수치와는 무관한 참고 그림")}${(q.fig[1]&&q.fig[1].flag) ? `<span class="figflag">${esc(q.fig[1].flag)}</span>` : ""}</div>
        <div class="tools" style="margin:0"><button class="iconbtn" type="button" id="zoom">⤢ 크게 보기</button><button class="iconbtn" type="button" id="replay">↻ 다시 그리기</button></div>
      </div>
      <div class="stage-wrap" id="stage">${svgFor(q)}</div>
    </section>
  </main>
  <aside id="panelCol"><div class="card panel">
    <div class="ph"><span>문항 ${k+1} / ${list.length}</span>${graded ? `<span class="verdict ${a===q.a?"v-ok":"v-no"}">${a===q.a?"정답":"오답"}</span>` : `<span class="lvchip lv-${q.lv}">${LVNAME[q.lv]}</span>`}</div>
    <h2>${esc(q.title)}</h2>
    <div class="qhdr">보기 — 하나를 고르십시오</div>
    <div class="opts">${q.opts.map((o,j)=>{
      let cls="opt"; if (graded){ if(j===q.a) cls+=" ok"; else if(j===a) cls+=" no"; } else if (j===a) cls+=" sel";
      return `<button type="button" class="${cls}" data-ans="${j}"><span class="n">${"①②③④"[j]}</span><span>${esc(o)}</span></button>`;
    }).join("")}</div>
    ${graded ? `<div class="exp"><span class="k">해설</span><p>${esc(q.exp)}</p></div>` : ""}
    <div class="gradebar"><button class="big" type="button" id="gradeBtn" ${graded||remain?"disabled":""}>${graded?"채점 완료":(remain?`채점 (남은 문항 ${remain}개)`:"전체 채점하기")}</button></div>
    <div class="nav"><button type="button" ${prev?`data-go="q${prev.i}"`:"disabled"}>← 이전</button>
      ${graded
        ? `<button type="button" class="nx" data-go="${next?`q${next.i}`:"result"}">${next?"다음 문항 →":"결과 보기 →"}</button>`
        : (!answered
            ? `<button type="button" class="nx" disabled>답을 선택해야 넘어갑니다</button>`
            : (next
                ? `<button type="button" class="nx" data-go="q${next.i}">다음 문항 →</button>`
                : `<button type="button" class="nx" id="finBtn">채점하고 결과 보기 →</button>`))}</div>
    <div class="hint2">${graded ? "채점 완료 — 해설을 확인하십시오" : "답을 고른 뒤 <b>다음 문항</b>을 눌러야 넘어갑니다"} · <kbd>1</kbd>–<kbd>4</kbd> 보기 · <kbd>Z</kbd> 그림 확대</div>
  </div></aside>`;

  fitStage(document.getElementById("figRow"));
  document.getElementById("replay").onclick = ()=>{ const w=document.getElementById("stage"); const t=w.innerHTML; w.innerHTML=""; void w.offsetWidth; w.innerHTML=t; fitStage(document.getElementById("figRow")); };
  document.getElementById("zoom").onclick = ()=>openLB(q);
  document.querySelectorAll("[data-ans]").forEach(b=> b.onclick = ()=>{
    if (graded) return;
    answers[idx] = +b.dataset.ans; saveAll(); render();
  });
  const gb = document.getElementById("gradeBtn"); if (gb) gb.onclick = ()=>doGrade(false);
  const fb = document.getElementById("finBtn"); if (fb) fb.onclick = ()=>doGrade(false);
  document.body.classList.remove("scrollable"); document.documentElement.classList.remove("sc");
  startTimer();
}

function fitStage(root){
  const sv = (root||document).querySelector("svg.stage"); if(!sv) return;
  try{
    const bb = sv.getBBox();
    if(!bb || !isFinite(bb.width) || bb.width < 20 || bb.height < 20) return;
    const pad = 8;
    sv.setAttribute("viewBox", (bb.x-pad)+" "+(bb.y-pad)+" "+(bb.width+pad*2)+" "+(bb.height+pad*2));
  }catch(e){}
}

function openLB(q){ document.getElementById("lbT").textContent = q.title + (q.figkind==="case" ? " — 상황도 (문항 조건 반영)" : (q.fig[0]==="f_note" ? " — 핵심 개념 카드" : " — 주제 개념도 (문항 수치와 무관)"));
  document.getElementById("lbB").innerHTML = `<div class="stage-wrap">${svgFor(q)}</div>`;
  document.getElementById("lb").hidden = false; fitStage(document.getElementById("lbB")); }
document.getElementById("lbX").onclick = ()=>{ document.getElementById("lb").hidden = true; };
document.getElementById("lb").onclick = e=>{ if(e.target.id==="lb") document.getElementById("lb").hidden = true; };

function doGrade(force){
  const list = active();
  if (!list.length) return;
  if (!force && !list.every(o=>answers[o.i]!=null)) return;
  stopTimer();
  graded = true;
  const right = list.filter(o=>answers[o.i]===o.q.a).length;
  const unans = list.filter(o=>answers[o.i]==null).length;
  const used = startAt ? Math.min(Date.now()-startAt, limitMs()) : 0;
  history.push({ t: Date.now(), lv: cfg.lv, n: list.length, right, pct: right/list.length*100,
                 unans, used, limit: limitMs(), timeout: !!force });
  if (history.length > 40) history = history.slice(-40);
  wr("hbmq-hist", history); saveAll();
  location.hash = "result"; render();
}

/* ══════════ 결과 화면 ══════════ */
function renderResult(){
  stopTimer(); document.body.classList.add("scrollable"); document.documentElement.classList.add("sc"); paintTimer();
  const list = active();
  if (!list.length) { renderHistory(); return; }
  const answered = list.filter(o=>answers[o.i]!=null).length;
  const right = list.filter(o=>answers[o.i]===o.q.a).length;
  const pct = list.length ? right/list.length*100 : 0;
  const byLv = ["B","I","A"].map((lv,i)=>{ const s=list.filter(o=>o.q.lv===lv);
    const r=s.filter(o=>answers[o.i]===o.q.a).length; return [LVNAME[lv], s.length?r/s.length*100:0, ["#dff0de","#cfe0f5","#f6d3d0"][i], `${r}/${s.length}`]; }).filter(x=>x[3]!=="0/0");
  const byDom = domains().map(([dom,l])=>{ const r=l.filter(o=>answers[o.i]===o.q.a).length;
    return [dom, l.length?r/l.length*100:0, domColor(dom), `${r}/${l.length}`]; });
  const wrong = list.filter(o=>graded && answers[o.i]!==o.q.a);
  const lastRun = history.length ? history[history.length-1] : null;
  document.getElementById("app").innerHTML = `
  <aside class="card side" id="side">${sideHTML(-1)}</aside>
  <main id="main" style="grid-column:2 / 4;grid-row:1">
    <div class="crumb">결과</div>
    <div class="hd"><h1>${graded?"채점 결과":"진행 상황"}</h1><div class="chips"><span class="chip">${cfg.lv==="ALL"?"전체":LVNAME[cfg.lv]}</span><span class="chip">${list.length}문항</span></div></div>
    <p class="sub">${graded?"오답 문항을 눌러 해설과 상황도를 다시 확인할 수 있습니다.":"모든 문항에 답하면 자동으로 채점됩니다."}</p>
    <section class="card res">
      <div class="score">
        <div class="b"><div class="l">득점률</div><div class="v">${graded?pct.toFixed(0)+"%":"–"}</div></div>
        <div class="b"><div class="l">정답 / 문항</div><div class="v">${graded?right:"–"} / ${list.length}</div></div>
        <div class="b"><div class="l">응답</div><div class="v">${answered} / ${list.length}</div></div>
        <div class="b"><div class="l">소요 / 제한</div><div class="v">${lastRun ? mmss(lastRun.used) : "–"} <span style="font-size:13px;color:var(--muted)">/ ${mmss(limitMs())}</span></div></div>
        <div class="b"><div class="l">응시 회차</div><div class="v">${history.length}</div></div>
      </div>
      ${lastRun && lastRun.timeout ? `<p class="sub" style="color:var(--rust);font-weight:700;margin:-6px 0 10px">제한 시간이 끝나 자동 채점되었습니다 — 미응답 ${lastRun.unans}문항은 오답으로 처리했습니다.</p>` : ""}
      <h4>난이도별 정답률</h4>${graded?barChart(byLv):"<p class='sub'>채점 후 표시됩니다.</p>"}
      <h4>영역별 정답률</h4>${graded?barChart(byDom):"<p class='sub'>채점 후 표시됩니다.</p>"}
      <h4>회차별 득점률 변화</h4>${history.length?lineChart(history):"<p class='sub'>아직 기록이 없습니다.</p>"}
      ${wrong.length?`<h4>오답 ${wrong.length}문항</h4><ul class="wrongs">${wrong.map(o=>`<li><b>${LVNAME[o.q.lv]}</b><span>${esc(o.q.title)}</span><button type="button" data-go="q${o.i}">다시 보기</button></li>`).join("")}</ul>`:(graded?"<h4>오답 없음</h4>":"")}
    </section>
  </main>
  <aside id="panelCol" style="grid-column:2 / 4;grid-row:2;position:static"><div class="card panel">
    <div class="ph"><span>다음 단계</span><span>${list.length}문항</span></div>
    <h2>다시 응시하기</h2>
    <p class="stem">조건을 바꾸어 새로 출제하거나, 같은 문항을 처음부터 다시 풀 수 있습니다.
      오답만 다시 보려면 아래 목록에서 해당 문항으로 이동하십시오.</p>
    <div class="toolbar">
      <button class="iconbtn" type="button" data-go="start">조건 바꿔 새로 출제</button>
      <button class="iconbtn" type="button" id="retry">같은 문항 다시 풀기</button>
      <button class="iconbtn" type="button" id="clearHist">이력 초기화</button>
    </div>
    <div class="nav"><button type="button" data-go="q${list.length?list[0].i:0}">← 첫 문항</button>
      <button type="button" class="nx" data-go="q${wrong.length?wrong[0].i:(list.length?list[0].i:0)}">${wrong.length?"첫 오답으로 →":"처음부터 →"}</button></div>
  </div></aside>`;
  document.getElementById("retry").onclick = ()=>{ answers={}; graded=false; saveAll(); location.hash="q"+exam[0]; render(); };
  document.getElementById("clearHist").onclick = ()=>{ history=[]; wr("hbmq-hist",[]); render(); };
}

/* ── 응시 이력 화면 (진행 중인 시험이 없을 때) ── */
function renderHistory(){
  const LVN = { ALL:"전체", B:"초급", I:"중급", A:"고급" };
  const rows = history.slice().reverse();
  document.getElementById("app").innerHTML = `
  <main id="main" style="grid-column:1 / -1;grid-row:1">
    <div class="crumb">응시 이력</div>
    <div class="hd"><h1>지난 응시 이력</h1><div class="chips"><span class="chip">${history.length}회</span></div></div>
    <p class="sub">진행 중인 시험이 없어 지난 기록만 보여 줍니다. 새 시험은 상단 [시험 구성] 에서 시작하십시오.</p>
    <section class="card res">
      ${history.length ? `
      <div class="score">
        <div class="b"><div class="l">응시 회차</div><div class="v">${history.length}</div></div>
        <div class="b"><div class="l">최근 득점률</div><div class="v">${history[history.length-1].pct.toFixed(0)}%</div></div>
        <div class="b"><div class="l">평균 득점률</div><div class="v">${(history.reduce((a,x)=>a+x.pct,0)/history.length).toFixed(0)}%</div></div>
        <div class="b"><div class="l">최고 득점률</div><div class="v">${Math.max(...history.map(x=>x.pct)).toFixed(0)}%</div></div>
      </div>
      <h4>회차별 득점률 변화</h4>${lineChart(history)}
      <h4>회차 기록</h4>
      <table class="histtab"><tr><th>회차</th><th>일시</th><th>난이도</th><th>문항</th><th>정답</th><th>득점률</th><th>소요 / 제한</th><th>비고</th></tr>
      ${rows.map((h,ri)=>{ const no = history.length - ri; const d = new Date(h.t);
        const dt = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
        return `<tr><td>${no}</td><td>${dt}</td><td>${LVN[h.lv]||h.lv||"전체"}</td><td>${h.n}</td><td>${h.right}</td>
          <td><b>${h.pct.toFixed(0)}%</b></td><td>${h.used!=null?mmss(h.used):"–"} / ${h.limit!=null?mmss(h.limit):"–"}</td>
          <td>${h.timeout?`<span style="color:var(--rust);font-weight:700">시간 초과 · 미응답 ${h.unans||0}</span>`:"완주"}</td></tr>`;
      }).join("")}</table>` : "<p class='sub'>아직 응시 기록이 없습니다.</p>"}
      <div class="toolbar" style="margin-top:16px">
        <button class="iconbtn" type="button" data-go="start">시험 구성으로</button>
        <button class="iconbtn" type="button" id="clearHist2">이력 초기화</button>
      </div>
    </section>
  </main>`;
  const c = document.getElementById("clearHist2"); if (c) c.onclick = ()=>{ history=[]; wr("hbmq-hist",[]); renderHistory(); };
  document.getElementById("topProg").textContent = `${history.length}회 기록`;
  document.getElementById("modeChip").textContent = "응시 이력";
  document.getElementById("modeChip").style.background = "var(--violet)";
}

/* ── 전역 이벤트 ── */
document.addEventListener("click", e=>{ const b=e.target.closest("[data-go]"); if(b){ e.preventDefault();
  if(location.hash === "#"+b.dataset.go) render(); else location.hash = b.dataset.go; window.scrollTo({top:0}); } });
document.addEventListener("keydown", e=>{
  if (e.target.closest("input,textarea")) return;
  if (e.key === "Escape"){ document.getElementById("lb").hidden = true; return; }
  const list = active(), h = location.hash.replace("#","");
  let k = list.findIndex(o=>"q"+o.i===h);
  if (e.key === "ArrowRight" && k>=0 && list[k+1] && (graded || answers[list[k].i]!=null)) location.hash = "q"+list[k+1].i;
  else if (e.key === "ArrowLeft" && k>0) location.hash = "q"+list[k-1].i;
  else if ((e.key==="z"||e.key==="Z") && k>=0) openLB(list[k].q);
  else if (["1","2","3","4"].indexOf(e.key)>=0 && k>=0 && !graded){ const b=document.querySelector(`[data-ans="${+e.key-1}"]`); if(b) b.click(); }
});
document.getElementById("themeBtn").onclick = ()=>{ const r=document.documentElement,
  dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; };
document.getElementById("resBtn").onclick = ()=>{ location.hash="result"; render(); };
document.getElementById("startBtn").onclick = ()=>{ location.hash="start"; render(); };
document.getElementById("navBtn").onclick = ()=>{ document.body.classList.toggle("nav-off"); };
window.addEventListener("hashchange", render);
// 기동 시 저장된 진행 상태 제거 → 항상 '시험 구성' 화면에서 시작
wr("hbmq-exam", null); wr("hbmq-ans", {}); wr("hbmq-graded", false); wr("hbmq-start", 0);
startAt = 0;
if (location.hash !== "#start") { try { history0.replaceState(null, "", location.pathname + location.search + "#start"); } catch(e) { location.hash = "start"; } }
render();
</script>
