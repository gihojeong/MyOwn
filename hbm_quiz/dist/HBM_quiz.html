/* ══════════ 좌측 tree ══════════ */
function sideHTML(curIdx){
  const doms = domains(), tot = active().length, done = active().filter(o=>answers[o.i]!=null).length;
  const lst = active(), gate = lst.findIndex(o=>answers[o.i]==null);
  const locked = (i)=> !graded && gate >= 0 && lst.findIndex(o=>o.i===i) > gate;
  let h = `<h3><span>출제 범위</span><span>${doms.length}개 영역 · ${tot}문항</span></h3>`;
  doms.forEach(([dom, list])=>{
    const n = list.filter(o=>answers[o.i]!=null).length, open = list.some(o=>o.i===curIdx);
    h += `<div class="les${open?" open":""}"><button type="button" data-go="q${list[0].i}"><span class="sq" style="background:${domColor(dom)}"></span>${esc(dom)}<span class="cnt${n===list.length?" done":""}">${n}/${list.length}</span></button>
      <ul class="steps">${list.map((o,k)=>{
        const a=answers[o.i], mark = graded ? (a===o.q.a?"✓":"✕") : (a!=null?"●":"·");
        const lk = locked(o.i), ck = graded ? (a===o.q.a?" g-ok":" g-no") : (a!=null?" a":"");
        return `<li><button type="button" ${lk?'disabled style="opacity:.42"':`data-go="q${o.i}"`}${o.i===curIdx?' aria-current="step"':''}><span class="ck${ck}" aria-hidden="true">${lk?"·":mark}</span><span>${k+1}. ${esc(o.q.title)}</span></button></li>`;}).join("")}</ul></div>`;
  });
  h += `<button class="refbtn" type="button" data-go="result">결과 보기</button>
        <button class="refbtn" type="button" data-go="start">시험 구성 다시 하기</button>
        <div class="prog"><span>응답</span><span>${done} / ${tot}</span></div>`;
  document.getElementById("topProg").textContent = `${done} / ${tot} 문항`; setProg(tot ? done / tot : 0);
  document.getElementById("modeChip").textContent = graded ? "채점 완료" : "응시 중";
  document.getElementById("modeChip").style.background = graded ? "var(--orange)" : "var(--green)";
  return h;
}

/* ══════════ 문항 화면 ══════════ */
function render(){
  const h = location.hash.replace("#","");
  if (h === "result"){ renderResult(); return; }          // 진행 중인 시험이 없으면 응시 이력 화면으로 넘어간다
  if (h === "start" || !exam || !exam.length){ renderStart(); return; }
  const list = active();
  let k = list.findIndex(o => "q"+o.i === h); if (k < 0) k = 0;
  const cur = list[k], q = cur.q, idx = cur.i;
  const doms = domains(), di = doms.findIndex(d=>d[0]===q.dom), sib = doms[di][1], si = sib.findIndex(o=>o.i===idx);
  const a = answers[idx], prev = list[k-1], next = list[k+1];
  const remain = list.filter(o=>answers[o.i]==null).length;
  const answered = a != null;
  const gate = list.findIndex(o=>answers[o.i]==null);   // 첫 미응답 위치 (없으면 -1)

  document.getElementById("app").innerHTML = `
  <aside class="card side" id="side" aria-label="출제 범위">${sideHTML(idx)}</aside>
  <main id="main">
    <div class="crumb">${esc(q.dom)}  /  이 영역 ${sib.length}문항 중 ${si+1}번</div>
    <div class="hd"><h1>${esc(q.title)}</h1><div class="chips">${lvChip(q.lv)}<span class="chip num">${k+1} / ${list.length}</span></div></div>
    <section class="card stemcard" aria-label="지문">
      <p class="stem">${esc(stemOf(q))}</p>
      ${q.metrics.length ? `<div class="qhdr">제시 조건</div>
      <div class="metrics">${q.metrics.map(m=>`<div class="metric"><div class="l"><span class="ic" aria-hidden="true">${esc(m[0])}</span><span>${esc(m[1])}</span></div><div class="v">${esc(m[2])}</div></div>`).join("")}</div>` : ""}
    </section>
    <section class="card canvas" id="figRow" aria-label="그림">
      <div class="fighd">
        <div class="qhdr">${q.figkind==="case" ? "상황도 — 이 문항의 조건이 반영된 그림" : (q.fig[0]==="f_note" ? "핵심 개념 — 판단의 근거가 되는 사실" : "주제 개념도 — 문항의 수치와는 무관한 참고 그림")}${(q.fig[1]&&q.fig[1].flag) ? `<span class="figflag">${esc(q.fig[1].flag)}</span>` : ""}</div>
        <div class="tools"><button class="iconbtn" type="button" id="zoom" aria-label="그림 크게 보기 (Z)"><span class="ic" aria-hidden="true">⤢</span><span class="lbl">크게 보기</span></button><button class="iconbtn" type="button" id="replay" aria-label="그림 다시 그리기"><span class="ic" aria-hidden="true">↻</span><span class="lbl">다시 그리기</span></button></div>
      </div>
      <div class="stage-wrap" id="stage">${svgFor(q)}</div>
    </section>
  </main>
  <aside id="panelCol" aria-label="보기와 해설"><div class="card panel">
    <div class="ph"><span>문항 <span class="num">${k+1} / ${list.length}</span></span>${graded ? `<span class="verdict ${a===q.a?"v-ok":"v-no"}">${a===q.a?"정답":(a==null?"미응답":"오답")}</span>` : lvChip(q.lv)}</div>
    <p class="ask">${esc(askOf(q))}</p>
    <div class="qhdr" id="optsLbl">보기 — 하나를 고르십시오 <span class="kbdhint" aria-hidden="true">(<kbd>1</kbd>–<kbd>4</kbd>)</span></div>
    <div class="opts" role="group" aria-labelledby="optsLbl">${q.opts.map((o,j)=>{
      let cls="opt", tag=""; if (graded){ if(j===q.a){ cls+=" ok"; tag=`<span class="tag">${j===a?"정답 · 내 답":"정답"}</span>`; } else if(j===a){ cls+=" no"; tag=`<span class="tag">내 답</span>`; } else cls+=" dim"; } else if (j===a) cls+=" sel";
      return `<button type="button" class="${cls}" data-ans="${j}" aria-pressed="${j===a}"${graded?' aria-disabled="true"':""}><span class="n" aria-hidden="true">${j+1}</span><span class="tx"><span class="sr">${j+1}번 보기: </span>${esc(o)}</span>${tag}</button>`;
    }).join("")}</div>
    ${graded ? `<div class="exp" role="note"><span class="k">해설 <span class="ans">— 정답 ${"①②③④"[q.a]}</span></span>${fmtExp(q.exp, q.src)}</div>` : ""}
    <div class="gradebar"><button class="big" type="button" id="gradeBtn" ${graded||remain?"disabled":""}>${graded?"채점 완료":(remain?`채점 (남은 문항 ${remain}개)`:"전체 채점하기")}</button></div>
    <div class="nav"><button type="button" ${prev?`data-go="q${prev.i}"`:"disabled"}>← 이전</button>
      ${graded
        ? `<button type="button" class="nx" data-go="${next?`q${next.i}`:"result"}">${next?"다음 문항 →":"결과 보기 →"}</button>`
        : (!answered
            ? `<button type="button" class="nx" disabled>답을 선택해야 넘어갑니다</button>`
            : (next
                ? `<button type="button" class="nx" data-go="q${next.i}">다음 문항 →</button>`
                : `<button type="button" class="nx" id="finBtn">채점하고 결과 보기 →</button>`))}</div>
    <div class="hint2">${graded ? "채점 완료 — 해설을 확인하십시오" : "답을 고른 뒤 <b>다음 문항</b>을 눌러야 넘어갑니다"}<span class="kbdhint"> · <kbd>1</kbd>–<kbd>4</kbd> 보기 · <kbd>←</kbd><kbd>→</kbd> 이동 · <kbd>Z</kbd> 그림 확대</span></div>
  </div></aside>`;

  mountFig(document.getElementById("figRow"));
  document.getElementById("replay").onclick = ()=>{ const w=document.getElementById("stage"); w.innerHTML=""; void w.offsetWidth; w.innerHTML=svgFor(q); mountFig(document.getElementById("figRow")); };
  document.getElementById("zoom").onclick = ()=>openLB(q);
  document.querySelectorAll("[data-ans]").forEach(b=> b.onclick = (e)=>{
    if (graded) return;
    const j = +b.dataset.ans; answers[idx] = j; saveAll(); render();
    const nb = document.querySelector(`[data-ans="${j}"]`); if (nb && (e && e.detail === 0 || document.activeElement === document.body)) nb.focus();
  });
  const gb = document.getElementById("gradeBtn"); if (gb) gb.onclick = ()=>doGrade(false);
  const fb = document.getElementById("finBtn"); if (fb) fb.onclick = ()=>doGrade(false);
  document.body.classList.remove("scrollable"); document.documentElement.classList.remove("sc");
  startTimer();
}

function fitStage(root){
  const sv = (root||document).querySelector("svg.stage"); if(!sv) return;
  try{
    const bb = sv.getBBox();
    if(!bb || !isFinite(bb.width) || bb.width < 20 || bb.height < 20) return;
    const pad = 8;
    sv.setAttribute("viewBox", (bb.x-pad)+" "+(bb.y-pad)+" "+(bb.width+pad*2)+" "+(bb.height+pad*2));
  }catch(e){}
}

function openLB(q){ document.getElementById("lbT").textContent = q.title + (q.figkind==="case" ? " — 상황도 (문항 조건 반영)" : (q.fig[0]==="f_note" ? " — 핵심 개념 카드" : " — 주제 개념도 (문항 수치와 무관)"));
  document.getElementById("lbB").innerHTML = `<div class="stage-wrap">${svgFor(q)}</div>`;
  document.getElementById("lb").hidden = false; mountFig(document.getElementById("lbB")); }
document.getElementById("lbX").onclick = ()=>{ document.getElementById("lb").hidden = true; };
document.getElementById("lb").onclick = e=>{ if(e.target.id==="lb") document.getElementById("lb").hidden = true; };

function doGrade(force){
  const list = active();
  if (!list.length) return;
  if (!force && !list.every(o=>answers[o.i]!=null)) return;
  stopTimer();
  graded = true;
  const right = list.filter(o=>answers[o.i]===o.q.a).length;
  const unans = list.filter(o=>answers[o.i]==null).length;
  const used = startAt ? Math.min(Date.now()-startAt, limitMs()) : 0;
  history.push({ t: Date.now(), lv: cfg.lv, n: list.length, right, pct: right/list.length*100,
                 unans, used, limit: limitMs(), timeout: !!force });
  if (history.length > 40) history = history.slice(-40);
  wr("hbmq-hist", history); saveAll();
  location.hash = "result"; render();
}

/* ══════════ 결과 화면 ══════════ */
function renderResult(){
  stopTimer(); document.body.classList.add("scrollable"); document.documentElement.classList.add("sc"); paintTimer();
  const list = active();
  if (!list.length) { renderHistory(); return; }
  const answered = list.filter(o=>answers[o.i]!=null).length;
  const right = list.filter(o=>answers[o.i]===o.q.a).length;
  const pct = list.length ? right/list.length*100 : 0;
  const byLv = ["B","I","A"].map((lv,i)=>{ const s=list.filter(o=>o.q.lv===lv);
    const r=s.filter(o=>answers[o.i]===o.q.a).length; return [LVNAME[lv], s.length?r/s.length*100:0, ["#dff0de","#cfe0f5","#f6d3d0"][i], `${r}/${s.length}`]; }).filter(x=>x[3]!=="0/0");
  const byDom = domains().map(([dom,l])=>{ const r=l.filter(o=>answers[o.i]===o.q.a).length;
    return [dom, l.length?r/l.length*100:0, domColor(dom), `${r}/${l.length}`]; });
  const wrong = list.filter(o=>graded && answers[o.i]!==o.q.a);
  setProg(list.length ? answered / list.length : 0);
  const lastRun = history.length ? history[history.length-1] : null;
  document.getElementById("app").innerHTML = `
  <aside class="card side" id="side">${sideHTML(-1)}</aside>
  <main id="main" class="wide">
    <div class="crumb">결과</div>
    <div class="hd"><h1>${graded?"채점 결과":"진행 상황"}</h1><div class="chips"><span class="chip">${cfg.lv==="ALL"?"전체":LVNAME[cfg.lv]}</span><span class="chip">${list.length}문항</span></div></div>
    <p class="sub">${graded?"오답 문항을 눌러 해설과 상황도를 다시 확인할 수 있습니다.":"모든 문항에 답하면 자동으로 채점됩니다."}</p>
    <section class="card res">
      <div class="score">
        <div class="b"><div class="l">득점률</div><div class="v">${graded?pct.toFixed(0)+"%":"–"}</div></div>
        <div class="b"><div class="l">정답 / 문항</div><div class="v">${graded?right:"–"} / ${list.length}</div></div>
        <div class="b"><div class="l">응답</div><div class="v">${answered} / ${list.length}</div></div>
        <div class="b"><div class="l">소요 / 제한</div><div class="v">${lastRun ? mmss(lastRun.used) : "–"} <small>/ ${mmss(limitMs())}</small></div></div>
        <div class="b"><div class="l">응시 회차</div><div class="v">${history.length}</div></div>
      </div>
      ${lastRun && lastRun.timeout ? `<p class="warnline">제한 시간이 끝나 자동 채점되었습니다 — 미응답 ${lastRun.unans}문항은 오답으로 처리했습니다.</p>` : ""}
      <h4>난이도별 정답률</h4>${graded?barChart(byLv):"<p class='sub'>채점 후 표시됩니다.</p>"}
      <h4>영역별 정답률</h4>${graded?barChart(byDom):"<p class='sub'>채점 후 표시됩니다.</p>"}
      <h4>회차별 득점률 변화</h4>${history.length?lineChart(history):"<p class='sub'>아직 기록이 없습니다.</p>"}
      ${wrong.length?`<h4>오답 ${wrong.length}문항</h4><ul class="wrongs">${wrong.map(o=>`<li>${lvChip(o.q.lv)}<span>${esc(o.q.title)}</span><button type="button" data-go="q${o.i}">다시 보기</button></li>`).join("")}</ul>`:(graded?"<h4>오답 없음</h4>":"")}
    </section>
  </main>
  <aside id="panelCol" class="wide"><div class="card panel">
    <div class="ph"><span>다음 단계</span><span>${list.length}문항</span></div>
    <h2>다시 응시하기</h2>
    <p class="stem">조건을 바꾸어 새로 출제하거나, 같은 문항을 처음부터 다시 풀 수 있습니다.
      오답만 다시 보려면 아래 목록에서 해당 문항으로 이동하십시오.</p>
    <div class="toolbar">
      <button class="iconbtn" type="button" data-go="start">조건 바꿔 새로 출제</button>
      <button class="iconbtn" type="button" id="retry">같은 문항 다시 풀기</button>
      <button class="iconbtn" type="button" id="clearHist">이력 초기화</button>
    </div>
    <div class="nav"><button type="button" data-go="q${list.length?list[0].i:0}">← 첫 문항</button>
      <button type="button" class="nx" data-go="q${wrong.length?wrong[0].i:(list.length?list[0].i:0)}">${wrong.length?"첫 오답으로 →":"처음부터 →"}</button></div>
  </div></aside>`;
  document.getElementById("retry").onclick = ()=>{ answers={}; graded=false; saveAll(); location.hash="q"+exam[0]; render(); };
  document.getElementById("clearHist").onclick = ()=>{ history=[]; wr("hbmq-hist",[]); render(); };
}

/* ── 응시 이력 화면 (진행 중인 시험이 없을 때) ── */
function renderHistory(){
  const LVN = { ALL:"전체", B:"초급", I:"중급", A:"고급" };
  const rows = history.slice().reverse();
  document.getElementById("app").innerHTML = `
  <main id="main" style="grid-column:1 / -1;grid-row:1">
    <div class="crumb">응시 이력</div>
    <div class="hd"><h1>지난 응시 이력</h1><div class="chips"><span class="chip">${history.length}회</span></div></div>
    <p class="sub">진행 중인 시험이 없어 지난 기록만 보여 줍니다. 새 시험은 상단 [시험 구성] 에서 시작하십시오.</p>
    <section class="card res">
      ${history.length ? `
      <div class="score">
        <div class="b"><div class="l">응시 회차</div><div class="v">${history.length}</div></div>
        <div class="b"><div class="l">최근 득점률</div><div class="v">${history[history.length-1].pct.toFixed(0)}%</div></div>
        <div class="b"><div class="l">평균 득점률</div><div class="v">${(history.reduce((a,x)=>a+x.pct,0)/history.length).toFixed(0)}%</div></div>
        <div class="b"><div class="l">최고 득점률</div><div class="v">${Math.max(...history.map(x=>x.pct)).toFixed(0)}%</div></div>
      </div>
      <h4>회차별 득점률 변화</h4>${lineChart(history)}
      <h4>회차 기록</h4>
      <div class="tablewrap"><table class="histtab"><tr><th>회차</th><th>일시</th><th>난이도</th><th>문항</th><th>정답</th><th>득점률</th><th>소요 / 제한</th><th>비고</th></tr>
      ${rows.map((h,ri)=>{ const no = history.length - ri; const d = new Date(h.t);
        const dt = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
        return `<tr><td>${no}</td><td>${dt}</td><td>${LVN[h.lv]||h.lv||"전체"}</td><td>${h.n}</td><td>${h.right}</td>
          <td><b>${h.pct.toFixed(0)}%</b></td><td>${h.used!=null?mmss(h.used):"–"} / ${h.limit!=null?mmss(h.limit):"–"}</td>
          <td>${h.timeout?`<span style="color:var(--rust);font-weight:700">시간 초과 · 미응답 ${h.unans||0}</span>`:"완주"}</td></tr>`;
      }).join("")}</table></div>` : "<p class='sub'>아직 응시 기록이 없습니다.</p>"}
      <div class="toolbar" style="margin-top:16px">
        <button class="iconbtn" type="button" data-go="start">시험 구성으로</button>
        <button class="iconbtn" type="button" id="clearHist2">이력 초기화</button>
      </div>
    </section>
  </main>`;
  const c = document.getElementById("clearHist2"); if (c) c.onclick = ()=>{ history=[]; wr("hbmq-hist",[]); renderHistory(); };
  document.getElementById("topProg").textContent = `${history.length}회 기록`; setProg(0);
  document.getElementById("modeChip").textContent = "응시 이력";
  document.getElementById("modeChip").style.background = "var(--violet)";
}

/* ── 전역 이벤트 ── */
document.addEventListener("click", e=>{ const b=e.target.closest("[data-go]"); if(b){ e.preventDefault();
  if(location.hash === "#"+b.dataset.go) render(); else location.hash = b.dataset.go; window.scrollTo({top:0}); } });
document.addEventListener("keydown", e=>{
  if (e.target.closest("input,textarea")) return;
  if (e.key === "Escape"){ document.getElementById("lb").hidden = true; return; }
  const list = active(), h = location.hash.replace("#","");
  let k = list.findIndex(o=>"q"+o.i===h);
  if (e.key === "ArrowRight" && k>=0 && list[k+1] && (graded || answers[list[k].i]!=null)) location.hash = "q"+list[k+1].i;
  else if (e.key === "ArrowLeft" && k>0) location.hash = "q"+list[k-1].i;
  else if ((e.key==="z"||e.key==="Z") && k>=0) openLB(list[k].q);
  else if (["1","2","3","4"].indexOf(e.key)>=0 && k>=0 && !graded){ const b=document.querySelector(`[data-ans="${+e.key-1}"]`); if(b) b.click(); }
});
document.getElementById("themeBtn").onclick = ()=>{ const r=document.documentElement,
  dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; try{ localStorage.setItem("hbmq-theme", r.dataset.theme); }catch(e){} };
document.getElementById("resBtn").onclick = ()=>{ location.hash="result"; render(); };
document.getElementById("startBtn").onclick = ()=>{ location.hash="start"; render(); };
const NARROW = matchMedia("(max-width: 1180px)");
function navState(){ const nb=document.getElementById("navBtn"), b=document.body;
  nb.setAttribute("aria-expanded", String(NARROW.matches ? b.classList.contains("nav-open") : !b.classList.contains("nav-off"))); }
document.getElementById("navBtn").onclick = ()=>{ document.body.classList.toggle(NARROW.matches ? "nav-open" : "nav-off"); navState();
  if (NARROW.matches && document.body.classList.contains("nav-open")) { const sd=document.getElementById("side"); if (sd) sd.scrollIntoView({block:"start"}); } };
if (NARROW.addEventListener) NARROW.addEventListener("change", navState);
window.addEventListener("hashchange", ()=>{ render(); if (NARROW.matches) document.body.classList.remove("nav-open"); navState(); });
// 기동 시 저장된 진행 상태 제거 → 항상 '시험 구성' 화면에서 시작
wr("hbmq-exam", null); wr("hbmq-ans", {}); wr("hbmq-graded", false); wr("hbmq-start", 0);
startAt = 0;
if (location.hash !== "#start") { try { history0.replaceState(null, "", location.pathname + location.search + "#start"); } catch(e) { location.hash = "start"; } }
render();
</script>
</body>
</html>
